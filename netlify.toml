[build]
  base = "watchtower"
  publish = "public"
  functions = "netlify/functions"
  command = "npm run check"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Preserve the exact Aug 29 Global Sky visual while the backend migration goes live.
# The old deploy URL is immutable, so this is a controlled reverse proxy rather than
# a redirect away from watchtower.barbph.com. Relative /api calls still hit the new site.
[[redirects]]
  from = "/*"
  to = "https://6a92f93b90ee21cdc0f68168--thriving-pie-e168bd.netlify.app/:splat"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/camera-scout.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
