name: Package Current BarbPH Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-current-source.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record packaged commit
        run: git rev-parse HEAD > PACKAGED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: barbph-current-source
          path: |
            .
            !.git
            !node_modules
            !dist
            !dist-functions
          include-hidden-files: true
          retention-days: 1
