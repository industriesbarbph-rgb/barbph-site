name: Rebuild Catalog

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-catalog.js"
      - "netlify/functions/catalog-feed.mjs"
      - ".github/workflows/rebuild.yml"

permissions:
  contents: write

concurrency:
  group: barbph-catalog-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build catalog from safe public control sheet
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const oldId = '1TSpt_DxEDhpsXE09lNx8S63b7cDomEXhVua--p99DGM';
          const publicId = '1NA3jrA3gdctbpfhXtz2TAiRGRFWsyWRTT6EvoJNIfUw';
          const source = fs.readFileSync('build-catalog.js', 'utf8').replaceAll(oldId, publicId);
          fs.writeFileSync('.catalog-build.mjs', source);
          NODE
          node .catalog-build.mjs
          rm -f .catalog-build.mjs

      - name: Commit updated catalog pages only when data changed
        run: |
          git config user.name "barbph-auto-build"
          git config user.email "actions@github.com"

          git add products.html programs.html

          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Auto-rebuild Products and Programs from safe public control sheet [skip netlify]"
            git push
          fi
