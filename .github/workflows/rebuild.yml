name: Rebuild Catalog

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-catalog.js"
      - "netlify/functions/catalog-feed.mjs"
      - ".github/workflows/rebuild.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the catalog build script
        run: node build-catalog.js

      - name: Commit updated catalog pages (if changed)
        run: |
          git config user.name "barbph-auto-build"
          git config user.email "actions@github.com"

          git add products.html programs.html

          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Auto-rebuild Products and Programs from spreadsheet"
            git push
          fi
