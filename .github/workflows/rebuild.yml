name: Rebuild Catalog

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-catalog.js"
      - "netlify/functions/catalog-feed.mjs"
      - ".github/workflows/rebuild.yml"

permissions:
  contents: write

concurrency:
  group: barbph-catalog-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Point runtime reads to the safe public control sheet
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const publicId = '1NA3jrA3gdctbpfhXtz2TAiRGRFWsyWRTT6EvoJNIfUw';
          const publicThemeGid = '2000682467';
          const buildPath = 'build-catalog.js';
          const buildText = fs.readFileSync(buildPath, 'utf8');
          const legacy = buildText.match(/\bconst\s+SHEET_ID\s*=\s*["']([A-Za-z0-9_-]+)["']/)?.[1] || publicId;

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(p));
              else if (entry.isFile()) out.push(p);
            }
            return out;
          }

          const files = [buildPath, ...walk('netlify/functions').filter(f => /\.(?:mjs|js|cjs)$/i.test(f))];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            text = text.replaceAll(legacy, publicId);
            text = text.replace(/gid=\d+/g, m => m === 'gid=342757810' ? `gid=${publicThemeGid}` : m);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Build catalog from safe public control sheet
        run: node build-catalog.js

      - name: Commit safe control migration and catalog changes only when needed
        run: |
          git config user.name "barbph-auto-build"
          git config user.email "actions@github.com"

          git add build-catalog.js netlify/functions products.html programs.html

          if git diff --cached --quiet; then
            echo "No catalog or control-source changes to commit."
          else
            git commit -m "Use safe public control sheet for BarbPH runtime data [skip netlify]"
            git push
          fi
