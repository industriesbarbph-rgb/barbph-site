name: Build satellite preview

on:
  push:
    branches:
      - satellite-live-telecast-preview

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: satellite-live-telecast-preview
          fetch-depth: 0

      - name: Add isolated satellite tab preview
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          s = index_path.read_text(encoding='utf-8')

          critical = [
              'src="ticker.html"',
              'data-connect-handle',
              'href="/products"',
              'href="/programs"',
              'href="/partnership"',
              'href="/publications"',
              'document.querySelectorAll(\'img[data-webp][src^="web/"]\')',
          ]
          for item in critical:
              assert item in s, f'Frozen production contract missing before patch: {item}'

          css = r'''/* BarbPH satellite live-telecast preview. Isolated from existing tab/drawer styling. */
          .folder-tab--satellite{z-index:7!important}
          .folder-tab--satellite .folder-tab__surface{overflow:hidden!important}
          .folder-tab--satellite .satellite-glyph{
            width:38px;height:34px;display:block;color:#343a3f;filter:drop-shadow(0 1px 0 rgba(255,255,255,.65));
          }
          .folder-tab--satellite .satellite-glyph *{vector-effect:non-scaling-stroke}

          .satellite-drawer{
            position:fixed;z-index:8998;left:50%;top:84px;width:min(760px,calc(100vw - 28px));
            transform:translate(-50%,-14px);opacity:0;visibility:hidden;pointer-events:none;
            transition:opacity .18s ease,transform .28s cubic-bezier(.2,.8,.2,1),visibility .18s ease;
          }
          .barb-ticker__topbar.is-satellite-open .satellite-drawer{
            transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;
          }
          .satellite-machine{
            position:relative;padding:18px 18px 15px;border:1px solid rgba(34,39,43,.78);border-radius:11px;
            background:
              repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.025) 1px 3px),
              linear-gradient(180deg,#dce0e2 0%,#aeb5ba 48%,#858d93 100%);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.84),inset 0 -14px 30px rgba(22,27,31,.16),0 24px 54px rgba(0,0,0,.24);
            color:#20262a;
          }
          .satellite-machine::before,.satellite-machine::after{
            content:"";position:absolute;top:10px;width:7px;height:7px;border-radius:50%;
            background:radial-gradient(circle at 35% 35%,#f1f2f2 0 18%,#6b7277 22% 60%,#2f3539 66% 100%);
            box-shadow:0 calc(100% + 130px) 0 #596066;
          }
          .satellite-machine::before{left:10px}.satellite-machine::after{right:10px}
          .satellite-machine__head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 12px 11px}
          .satellite-machine__id{
            font:800 9px/1 "Arial Narrow","DIN Condensed",Impact,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(28,34,38,.62)
          }
          .satellite-machine__signal{display:inline-flex;align-items:center;gap:7px;font:800 9px/1 "Arial Narrow","DIN Condensed",Impact,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#273036}
          .satellite-machine__signal::before{content:"";width:7px;height:7px;border-radius:50%;background:#2f393f;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 9px rgba(46,58,65,.45)}
          .satellite-lock{
            position:relative;border:1px solid rgba(29,34,38,.72);border-radius:7px;padding:9px;
            background:linear-gradient(180deg,#4b5257,#292f33 16%,#1d2225 84%,#3b4247);
            box-shadow:inset 0 0 0 2px rgba(255,255,255,.035),inset 0 8px 18px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.38)
          }
          .satellite-reel{
            position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);align-items:stretch;min-height:58px;
            border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(0,0,0,.48)
          }
          .satellite-reel:first-child{border-top:0}.satellite-reel:last-child{border-bottom:0}
          .satellite-reel__when{
            display:grid;place-items:center;padding:8px;color:#b8bec1;background:linear-gradient(90deg,#22272a,#30363a);
            font:900 10px/1 "Arial Narrow","DIN Condensed",Impact,sans-serif;letter-spacing:.18em;text-transform:uppercase;
            text-shadow:0 1px 0 #000
          }
          .satellite-reel__window{
            position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;padding:8px 38px 7px 20px;overflow:hidden;
            background:
              linear-gradient(180deg,rgba(255,255,255,.10),transparent 21%,transparent 78%,rgba(0,0,0,.22)),
              repeating-linear-gradient(90deg,#a9afb2 0 2px,#989fa3 2px 4px);
            box-shadow:inset 0 9px 15px rgba(0,0,0,.22),inset 0 -9px 15px rgba(0,0,0,.20)
          }
          .satellite-reel__window::before,.satellite-reel__window::after{
            content:"";position:absolute;top:50%;transform:translateY(-50%);width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent
          }
          .satellite-reel__window::before{left:6px;border-left:9px solid #2a3034}.satellite-reel__window::after{right:6px;border-right:9px solid #2a3034}
          .satellite-reel__source{
            min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#171b1e;
            font:900 clamp(15px,2.2vw,23px)/1 "OCR A Std","DIN Condensed","Arial Narrow",ui-monospace,monospace;
            letter-spacing:.105em;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.66),0 -1px 0 rgba(0,0,0,.16)
          }
          .satellite-reel__meta{
            min-height:12px;margin-top:5px;color:rgba(23,27,30,.62);
            font:800 8px/1.15 "Arial Narrow","DIN Condensed",Impact,sans-serif;letter-spacing:.14em;text-transform:uppercase
          }
          .satellite-reel--today .satellite-reel__window{
            background:
              linear-gradient(180deg,rgba(255,255,255,.18),transparent 22%,transparent 78%,rgba(0,0,0,.20)),
              repeating-linear-gradient(90deg,#c4c8ca 0 2px,#aeb4b7 2px 4px);
            box-shadow:inset 0 9px 16px rgba(0,0,0,.20),inset 0 -9px 16px rgba(0,0,0,.18),0 0 0 1px rgba(232,236,238,.18)
          }
          .satellite-reel--today .satellite-reel__source{color:#080b0d}
          .satellite-publication{
            display:block;margin:12px 11px 1px;color:#242a2e;text-decoration:none;
            font:700 11px/1.45 "Arial Narrow","DIN Condensed",Arial,sans-serif;letter-spacing:.035em
          }
          .satellite-publication:not([aria-disabled="true"]):hover{text-decoration:underline;text-underline-offset:3px}
          .satellite-publication[aria-disabled="true"]{opacity:.54;cursor:default}
          .satellite-status{margin:7px 11px 0;min-height:12px;color:rgba(25,30,34,.56);font:700 8px/1.3 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase}
          @media(max-width:720px){
            .satellite-drawer{top:79px;width:calc(100vw - 18px)}
            .satellite-machine{padding:14px 10px 12px}
            .satellite-reel{grid-template-columns:84px minmax(0,1fr);min-height:55px}
            .satellite-reel__when{font-size:9px;letter-spacing:.12em}
            .satellite-reel__window{padding-left:18px;padding-right:29px}
            .satellite-reel__source{font-size:14px;letter-spacing:.07em}
            .satellite-publication{font-size:10px;margin-left:6px;margin-right:6px}
          }
          @media(prefers-reduced-motion:reduce){.satellite-drawer{transition-duration:1ms!important}}
          '''

          js = r'''(() => {
            'use strict';
            const topbar = document.querySelector('[data-ticker-topbar]');
            const handle = document.querySelector('[data-satellite-handle]');
            const drawer = document.getElementById('barb-satellite-drawer');
            if (!topbar || !handle || !drawer) return;

            const rows = {
              yesterday: drawer.querySelector('[data-sat-day="yesterday"]'),
              today: drawer.querySelector('[data-sat-day="today"]'),
              tomorrow: drawer.querySelector('[data-sat-day="tomorrow"]')
            };
            const publication = drawer.querySelector('[data-sat-publication]');
            const status = drawer.querySelector('[data-sat-status]');
            let timer = null;

            const sourceEl = row => row?.querySelector('.satellite-reel__source');
            const metaEl = row => row?.querySelector('.satellite-reel__meta');

            function renderDay(key, day) {
              const row = rows[key];
              if (!row) return;
              const source = sourceEl(row);
              const meta = metaEl(row);
              if (!day) {
                if (source) source.textContent = 'AWAITING LOG';
                if (meta) meta.textContent = key === 'tomorrow' ? 'SCHEDULE PENDING' : 'NO TRANSMISSION RECORD';
                return;
              }
              const scheduled = day.scheduled || day.scheduled_source || '';
              const served = day.served || day.served_source || '';
              const fallback = Boolean(day.fallback || (scheduled && served && scheduled !== served));
              const visible = key === 'tomorrow' ? scheduled : (served || scheduled);
              if (source) source.textContent = visible || 'AWAITING SIGNAL';
              if (meta) {
                if (fallback) meta.textContent = `ASSIGNED · ${scheduled}  /  FALLBACK ENGAGED`;
                else if (key === 'today' && day.live) meta.textContent = 'LIVE ASSIGNMENT · NOW SERVING';
                else if (key === 'today') meta.textContent = 'TODAY\'S ASSIGNMENT';
                else if (key === 'tomorrow') meta.textContent = 'NEXT ASSIGNMENT';
                else meta.textContent = 'TRANSMISSION LOG';
              }
            }

            async function refresh() {
              if (status) status.textContent = 'SYNCING TRANSMISSION LOG…';
              try {
                const r = await fetch('/.netlify/functions/daily-discover-schedule', { cache: 'no-store' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                renderDay('yesterday', data.yesterday);
                renderDay('today', data.today);
                renderDay('tomorrow', data.tomorrow);
                if (publication) {
                  const url = String(data.publication_url || '').trim();
                  if (/^https:\/\//i.test(url) || /^\//.test(url)) {
                    publication.href = url;
                    publication.removeAttribute('aria-disabled');
                    publication.tabIndex = 0;
                  } else {
                    publication.removeAttribute('href');
                    publication.setAttribute('aria-disabled', 'true');
                    publication.tabIndex = -1;
                  }
                }
                if (status) status.textContent = data.updated_label || `MANILA DATE · ${data.date_manila || ''}`;
              } catch (err) {
                if (status) status.textContent = 'TRANSMISSION LOG TEMPORARILY UNAVAILABLE';
              }
            }

            function closeOtherPanels() {
              const ticker = document.querySelector('[data-barb-ticker]');
              const tickerHandle = document.querySelector('[data-ticker-handle]');
              if (ticker?.classList.contains('is-open') && tickerHandle) tickerHandle.click();
              const connectHandle = document.querySelector('[data-connect-handle]');
              if (topbar.classList.contains('is-connect-open') && connectHandle) connectHandle.click();
            }

            function setOpen(open) {
              if (open) closeOtherPanels();
              topbar.classList.toggle('is-satellite-open', open);
              handle.classList.toggle('is-active', open);
              handle.setAttribute('aria-expanded', String(open));
              drawer.setAttribute('aria-hidden', String(!open));
              if (open) {
                refresh();
                clearInterval(timer);
                timer = setInterval(refresh, 60000);
              } else {
                clearInterval(timer);
                timer = null;
              }
            }

            handle.addEventListener('click', () => setOpen(!topbar.classList.contains('is-satellite-open')));
            document.addEventListener('keydown', event => {
              if (event.key === 'Escape' && topbar.classList.contains('is-satellite-open')) setOpen(false);
            });
          })();
          '''

          fn = r'''import { getStore } from "@netlify/blobs";

          const SID = "1TSpt_DxEDhpsXE09lNx8S63b7cDomEXhVua--p99DGM";
          const TZ = "Asia/Manila";
          const POOL_VERSION = "2026-08-20-passed-9-history-v1";
          const HISTORY_KEY = "history/recent";
          const PASSED = new Set([
            "The Met Open Access","NASA","Smithsonian Open Access","Library of Congress","NOAA","USGS",
            "Art Institute of Chicago","Cleveland Museum of Art","National Gallery of Art"
          ]);

          function clean(v){return String(v??"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()}
          function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
          function dateManila(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),g=t=>p.find(x=>x.type===t)?.value;return `${g("year")}-${g("month")}-${g("day")}`}
          function addDays(date,delta){const d=new Date(`${date}T00:00:00Z`);d.setUTCDate(d.getUTCDate()+delta);return d.toISOString().slice(0,10)}
          async function getText(url,ms=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.text()}finally{clearTimeout(t)}}
          function parseCSV(s){const out=[];let r=[],f="",q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=""}else if(c==='\n'){r.push(f);out.push(r);r=[];f=""}else if(c!=='\r')f+=c}if(f||r.length){r.push(f);out.push(r)}return out}
          function table(raw,header){const rr=parseCSV(raw),h=rr.findIndex(r=>String(r[0]||"").trim().toLowerCase()===header.toLowerCase());if(h<0)throw new Error(`${header} header not found`);const heads=rr[h].map(x=>String(x).trim());return rr.slice(h+1).filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(heads.map((k,i)=>[k,String(r[i]||"").trim()]))) }
          async function themeRows(){const urls=[`https://docs.google.com/spreadsheets/d/${SID}/export?format=csv&gid=342757810`,`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("Theme Sources")}&headers=0`];let last="";for(const u of urls){try{const raw=await getText(u);if(/<html|accounts\.google\.com|sign in/i.test(raw)){last="Theme Sources is not anonymously readable";continue}return table(raw,"source_name")}catch(e){last=e.message}}throw new Error(last||"Theme Sources unavailable")}
          function weightedChoice(eligible,date,salt=""){const total=eligible.reduce((a,r)=>a+(+r.weight),0);let p=(hash(`barbph|${date}|production|${POOL_VERSION}|${salt}`)/4294967296)*total;for(const r of eligible){p-=+r.weight;if(p<0)return r}return eligible.at(-1)}
          function forecast(rows,date,last){const eligible=rows.filter(r=>String(r.enabled).toLowerCase()==="yes"&&PASSED.has(r.source_name)&&+r.weight>0);if(!eligible.length)return null;const reduced=last&&last!=="Barb Originals"&&eligible.length>1?eligible.filter(r=>r.source_name!==last):eligible;return weightedChoice(reduced.length?reduced:eligible,date,last||"none")?.source_name||null}
          function pack(record,scheduledFallback=null,live=false){if(!record&&!scheduledFallback)return null;const scheduled=clean(record?.scheduled_source||scheduledFallback),served=clean(record?.served_source||scheduled);return{scheduled,served,fallback:Boolean(scheduled&&served&&scheduled!==served),live:Boolean(live&&record)}}
          function publicationURL(rows){for(const row of rows){const u=clean(row.publication_url||row.live_telecast_publication_url||"");if(/^https:\/\//i.test(u)||/^\//.test(u))return u}return ""}

          export default async request=>{
            if(request.method!=="GET")return Response.json({error:"Method not allowed"},{status:405});
            try{
              const rows=await themeRows(),today=dateManila(),yesterday=addDays(today,-1),tomorrow=addDays(today,1);
              const store=getStore("barbph-daily-discover",{consistency:"strong"});
              const hist=await store.get(HISTORY_KEY,{type:"json"}).catch(()=>null);
              const history=Array.isArray(hist?.days)?hist.days:[];
              const y=history.find(x=>x?.date_manila===yesterday)||null;
              const tDay=await store.get(`day/${today}`,{type:"json"}).catch(()=>null);
              const tHist=history.find(x=>x?.date_manila===today)||null;
              const t=tDay||tHist||null;
              const scheduledToday=clean(t?.scheduled_source)||forecast(rows,today,clean(y?.served_source)||null);
              const todayPacked=pack(t,scheduledToday,true);
              const tomorrowScheduled=forecast(rows,tomorrow,todayPacked?.served||scheduledToday||null);
              return Response.json({
                date_manila:today,
                yesterday:pack(y),
                today:todayPacked,
                tomorrow:tomorrowScheduled?{scheduled:tomorrowScheduled,served:"",fallback:false,live:false}:null,
                publication_url:publicationURL(rows),
                updated_label:`TRANSMISSION LOG · MANILA ${today}`
              },{headers:{"cache-control":"public, max-age=60, s-maxage=180"}});
            }catch(error){return Response.json({error:"Schedule unavailable",detail:String(error?.message||error)},{status:503,headers:{"cache-control":"no-store"}})}
          };
          '''

          tab = r'''
              <button class="folder-tab folder-tab--satellite"
                      type="button"
                      data-satellite-handle
                      data-tab-key="satellite"
                      aria-label="Live telecast transmission log"
                      aria-expanded="false"
                      aria-controls="barb-satellite-drawer"
                      title="Live telecast">
                <span class="visually-hidden">Live telecast transmission log</span>
                <span class="folder-tab__surface folder-tab__icon" aria-hidden="true">
                  <svg class="satellite-glyph" viewBox="0 0 64 54" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="25" y="20" width="14" height="14" rx="2" transform="rotate(-18 32 27)"/>
                      <path d="M21 18l-9-5-5 9 10 4m26 10 9 5 5-9-10-4M28 34l-5 10m13-26 5-10"/>
                      <path d="M38 18c5 1 8 4 9 9m-7-13c7 1 12 6 13 13"/>
                      <circle cx="32" cy="27" r="2.1" fill="currentColor" stroke="none"/>
                    </g>
                  </svg>
                </span>
                <span class="folder-tab__hint" aria-hidden="true">Live Telecast</span>
              </button>
          '''

          panel = r'''
            <section class="satellite-drawer" id="barb-satellite-drawer" aria-hidden="true" aria-label="Live telecast transmission log">
              <div class="satellite-machine">
                <div class="satellite-machine__head">
                  <span class="satellite-machine__id">BarbPH · Transmission Register</span>
                  <span class="satellite-machine__signal">Live telecast</span>
                </div>
                <div class="satellite-lock" role="group" aria-label="Yesterday, today and tomorrow source assignments">
                  <div class="satellite-reel" data-sat-day="yesterday">
                    <div class="satellite-reel__when">Yesterday</div>
                    <div class="satellite-reel__window"><div class="satellite-reel__source">SYNCING</div><div class="satellite-reel__meta">TRANSMISSION LOG</div></div>
                  </div>
                  <div class="satellite-reel satellite-reel--today" data-sat-day="today">
                    <div class="satellite-reel__when">Today</div>
                    <div class="satellite-reel__window"><div class="satellite-reel__source">SYNCING</div><div class="satellite-reel__meta">TODAY'S ASSIGNMENT</div></div>
                  </div>
                  <div class="satellite-reel" data-sat-day="tomorrow">
                    <div class="satellite-reel__when">Tomorrow</div>
                    <div class="satellite-reel__window"><div class="satellite-reel__source">SYNCING</div><div class="satellite-reel__meta">NEXT ASSIGNMENT</div></div>
                  </div>
                </div>
                <a class="satellite-publication" data-sat-publication aria-disabled="true" tabindex="-1">What’s this? Read our publication: Inside BarbPH’s zero-word, zero-scroll build — baked with live telecast.. →</a>
                <div class="satellite-status" data-sat-status aria-live="polite">SYNCING TRANSMISSION LOG…</div>
              </div>
            </section>
          '''

          if 'satellite-tab.css' not in s:
              s = s.replace('</head>', '  <link rel="stylesheet" href="/satellite-tab.css">\n</head>', 1)
          if 'data-satellite-handle' not in s:
              marker = '    <a class="folder-tab folder-tab--products"'
              assert marker in s, 'Products tab insertion marker not found'
              s = s.replace(marker, tab + '\n' + marker, 1)
          if 'id="barb-satellite-drawer"' not in s:
              marker = '  </nav>\n\n  <div class="connect-drawer"'
              assert marker in s, 'Drawer insertion marker not found'
              s = s.replace(marker, '  </nav>\n\n' + panel + '\n\n  <div class="connect-drawer"', 1)
          if 'satellite-tab.js' not in s:
              s = s.replace('</body>', '  <script src="/satellite-tab.js" defer></script>\n</body>', 1)

          for item in critical:
              assert item in s, f'Frozen production contract changed by patch: {item}'
          assert s.count('data-satellite-handle') == 1
          assert s.count('id="barb-satellite-drawer"') == 1
          assert s.count('src="ticker.html"') == 1

          index_path.write_text(s, encoding='utf-8')
          Path('satellite-tab.css').write_text(css, encoding='utf-8')
          Path('satellite-tab.js').write_text(js, encoding='utf-8')
          Path('netlify/functions/daily-discover-schedule.mjs').write_text(fn, encoding='utf-8')
          PY

          git diff --check
          grep -F 'src="ticker.html"' index.html >/dev/null
          grep -F 'document.querySelectorAll('\''img[data-webp][src^="web/"]'\'')' index.html >/dev/null
          grep -F 'data-satellite-handle' index.html >/dev/null
          grep -F 'baked with live telecast.. →' index.html >/dev/null

      - name: Commit preview only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html satellite-tab.css satellite-tab.js netlify/functions/daily-discover-schedule.mjs
          git rm .github/workflows/build-satellite-preview.yml
          git commit -m "Build satellite live telecast preview"
          git push origin HEAD:satellite-live-telecast-preview
