name: One-Shot Tab Image Source Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-tab-images.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact one-line source-selection fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "document.querySelectorAll('img[data-webp]').forEach(img => {"
          new = "document.querySelectorAll('img[data-webp][src^=\"web/\"]').forEach(img => {"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one optimizer selector, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify only intended runtime behavior changed
        run: |
          grep -F "document.querySelectorAll('img[data-webp][src^=\"web/\"]').forEach(img => {" index.html
          git diff -- index.html

      - name: Remove temporary workflow and commit once
        run: |
          rm -f .github/workflows/fix-tab-images.yml
          git config user.name "barbph-tab-fix"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "Fix tab image source selection"
          git push origin HEAD:main
