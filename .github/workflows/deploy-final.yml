name: One-Shot BarbPH Production Launch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-final.yml

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact approved launch package
        run: |
          python -m pip install --quiet gdown
          gdown --id 1Zqbeol4kjpyexZ-dU4sIs-iIoTT01yx5 -O /tmp/barbph-final.zip

      - name: Verify approved ZIP
        run: |
          echo "d411b898641adbec4dca082fd557af472014032e78a96a2f020f7078d8746b71  /tmp/barbph-final.zip" | sha256sum -c -
          rm -rf /tmp/barbph-unpacked
          mkdir -p /tmp/barbph-unpacked
          unzip -q /tmp/barbph-final.zip -d /tmp/barbph-unpacked
          SRC="/tmp/barbph-unpacked/BarbPH_NETLIFY_PRODUCTION_FINAL_SEO_2026-08-23"
          test -f "$SRC/index.html"
          test -f "$SRC/netlify.toml"
          test -d "$SRC/netlify/functions"
          test "$(find "$SRC" -type f | wc -l | tr -d ' ')" = "37"

      - name: Overlay launch package without deleting proven runtime infrastructure
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/barbph-unpacked/BarbPH_NETLIFY_PRODUCTION_FINAL_SEO_2026-08-23"
          cp -a "$SRC"/. .

          # Keep the already-proven production priority controller and Daily Discover engine.
          git checkout HEAD -- netlify/functions/homepage-priority.mjs
          git checkout HEAD -- netlify/functions/daily-discover-production.mjs

          # Verify every other approved package file is byte-identical after the overlay.
          while IFS= read -r -d '' f; do
            rel="${f#"$SRC"/}"
            case "$rel" in
              netlify/functions/homepage-priority.mjs|netlify/functions/daily-discover-production.mjs) continue ;;
            esac
            cmp -s "$f" "$rel" || { echo "Mismatch after overlay: $rel"; exit 1; }
          done < <(find "$SRC" -type f -print0)

          # Remove this temporary launcher from the production commit.
          rm -f .github/workflows/deploy-final.yml

      - name: Commit production launch once
        run: |
          git config user.name "barbph-launch"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && { echo "Production already matches launch state."; exit 0; }
          git commit -m "Launch BarbPH production package 2026-08-23"
          git push origin HEAD:main
