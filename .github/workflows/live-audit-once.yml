name: BarbPH Live Audit Once

on:
  push:
    paths:
      - ".github/workflows/live-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source for reference
        uses: actions/checkout@v4

      - name: Run deep live audit
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json, re, html as htmlmod, time
          from pathlib import Path
          from html.parser import HTMLParser

          BASE = 'https://barbph.com'
          FAIL=[]; WARN=[]; PASS=[]; INFO=[]
          snapshots={}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener_follow = urllib.request.build_opener()
          opener_nofollow = urllib.request.build_opener(NoRedirect)

          def fetch(path, follow=True, timeout=25):
              url = path if path.startswith('http') else BASE + path
              req = urllib.request.Request(url, headers={'User-Agent':'BarbPH-Live-Audit/2026-08-31','Accept':'*/*'})
              op = opener_follow if follow else opener_nofollow
              try:
                  with op.open(req, timeout=timeout) as r:
                      body=r.read()
                      return {'url':url,'final_url':r.geturl(),'status':r.status,'headers':{k.lower():v for k,v in r.headers.items()},'body':body}
              except urllib.error.HTTPError as e:
                  try: body=e.read()
                  except Exception: body=b''
                  return {'url':url,'final_url':url,'status':e.code,'headers':{k.lower():v for k,v in e.headers.items()},'body':body}
              except Exception as e:
                  return {'url':url,'final_url':url,'status':0,'headers':{},'body':b'','error':repr(e)}

          def text(resp):
              return resp['body'].decode('utf-8','replace')

          def ok(label, cond, detail=''):
              (PASS if cond else FAIL).append(f"{label}" + (f": {detail}" if detail else ''))
              return cond

          def warn(label, cond, detail=''):
              if not cond: WARN.append(f"{label}" + (f": {detail}" if detail else ''))
              return cond

          def meta_content(h, attr, key):
              pat=rf'<meta\b(?=[^>]*\b{attr}=["\']{re.escape(key)}["\'])[^>]*\bcontent=["\']([^"\']*)["\'][^>]*>'
              m=re.search(pat,h,re.I)
              if m: return htmlmod.unescape(m.group(1)).strip()
              pat=rf'<meta\b(?=[^>]*\bcontent=["\']([^"\']*)["\'])[^>]*\b{attr}=["\']{re.escape(key)}["\'][^>]*>'
              m=re.search(pat,h,re.I)
              return htmlmod.unescape(m.group(1)).strip() if m else ''

          def canonical(h):
              m=re.search(r'<link\b(?=[^>]*\brel=["\']canonical["\'])[^>]*\bhref=["\']([^"\']+)',h,re.I)
              return htmlmod.unescape(m.group(1)).strip() if m else ''

          def title(h):
              m=re.search(r'<title>(.*?)</title>',h,re.I|re.S)
              return htmlmod.unescape(re.sub(r'\s+',' ',m.group(1))).strip() if m else ''

          def h1s(h):
              return [re.sub('<[^>]+>','',x).strip() for x in re.findall(r'<h1\b[^>]*>(.*?)</h1>',h,re.I|re.S)]

          page_specs={
            '/': ('BarbPH | Digital Assets, Coaching & Multidisciplinary Arts','https://barbph.com/','BarbPH | Digital Assets, Coaching Programs, Multidisciplinary Arts & Interactive Builds'),
            '/products': ('Digital Assets | BarbPH','https://barbph.com/products','Digital Assets | BarbPH'),
            '/programs': ('Coaching Programs | BarbPH','https://barbph.com/programs','Coaching Programs | BarbPH'),
            '/publications': ('Publications & Bulletin | BarbPH','https://barbph.com/publications','Publications & Bulletin | BarbPH'),
            '/partnership': ('Partnerships | BarbPH','https://barbph.com/partnership','Partnerships | BarbPH'),
          }

          page_html={}
          for path,(exp_title,exp_canon,exp_og) in page_specs.items():
              r=fetch(path); h=text(r); page_html[path]=h; snapshots[path]={'status':r['status'],'final_url':r['final_url'],'bytes':len(r['body'])}
              ok(f'{path} returns HTTP 200', r['status']==200, f"got {r['status']}")
              ok(f'{path} title', title(h)==exp_title, f"got {title(h)!r}")
              ok(f'{path} canonical', canonical(h)==exp_canon, f"got {canonical(h)!r}")
              ok(f'{path} og:title', meta_content(h,'property','og:title')==exp_og, f"got {meta_content(h,'property','og:title')!r}")
              ok(f'{path} og:url', meta_content(h,'property','og:url')==exp_canon, f"got {meta_content(h,'property','og:url')!r}")
              desc=meta_content(h,'name','description')
              ok(f'{path} description present', 50 <= len(desc) <= 190, f'length {len(desc)}')
              ok(f'{path} robots meta', 'index' in meta_content(h,'name','robots').lower(), meta_content(h,'name','robots'))
              ok(f'{path} exactly one H1', len(h1s(h))==1, f"H1s={h1s(h)}")
              ok(f'{path} html lang present', bool(re.search(r'<html\b[^>]*\blang=["\'][^"\']+',h,re.I)))
              jsonld=re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',h,re.I|re.S)
              ok(f'{path} structured data present', len(jsonld)>=1, f'{len(jsonld)} blocks')
              for i,b in enumerate(jsonld):
                  try: json.loads(b)
                  except Exception as e: FAIL.append(f'{path} JSON-LD block {i+1} invalid: {e}')
              imgs=re.findall(r'<img\b[^>]*>',h,re.I)
              missing_alt=[tag for tag in imgs if not re.search(r'\balt=["\']',tag,re.I)]
              ok(f'{path} image alt attributes', not missing_alt, f'{len(missing_alt)} missing')
              internal_html_links=re.findall(r'href=["\']((?!https?:|mailto:|tel:|#|javascript:)[^"\']*\.html(?:[?#][^"\']*)?)["\']',h,re.I)
              ok(f'{path} clean internal links', not internal_html_links, f'{internal_html_links[:8]}')
              for hk in ['x-content-type-options','referrer-policy','permissions-policy','strict-transport-security']:
                  ok(f'{path} security header {hk}', bool(r['headers'].get(hk)), r['headers'].get(hk,''))

          home=page_html.get('/', '')
          cdn_refs=re.findall(r'(\/\.netlify\/images\?[^"\'\s>]+)',home,re.I)
          ok('Homepage uses Netlify Image CDN for five tab images', len(set(cdn_refs))>=5, f'{len(set(cdn_refs))} unique refs')
          if cdn_refs:
              img=fetch(htmlmod.unescape(cdn_refs[0])); ct=img['headers'].get('content-type','')
              ok('Image CDN request returns 200', img['status']==200, f"{img['status']} {img.get('error','')}")
              ok('Image CDN serves WebP', 'image/webp' in ct.lower(), ct)

          redirect_specs={
            '/index.html':'/', '/products.html':'/products', '/programs.html':'/programs', '/publications.html':'/publications',
            '/partnership.html':'/partnership', '/partnerships.html':'/partnership', '/systems':'/?systems=open',
            '/systems.html':'/?systems=open', '/partnership-guide.html':'/partnership-guide', '/ticker.html':'/ticker'
          }
          for path,target in redirect_specs.items():
              r=fetch(path,follow=False)
              loc=r['headers'].get('location','')
              parsed=urllib.parse.urlsplit(loc)
              actual=(parsed.path or '') + (('?' + parsed.query) if parsed.query else '')
              ok(f'{path} redirects', r['status'] in (301,302,307,308), f"status {r['status']} location {loc}")
              ok(f'{path} redirect target', actual==target, f"expected {target}, got {actual}")

          for path in ['/partnership-guide','/ticker']:
              r=fetch(path); ok(f'{path} helper page available',r['status']==200,f'got {r["status"]}')

          private_paths=['/README.md','/ALIVE-FAB-SPEC.md','/BARBPH-SOURCE-OF-TRUTH.md','/LAUNCH-AUDIT.txt','/alive-fab-test.html','/daily-discover-test.html','/daily-discover-production-test.html','/diagnostic-hardening-test.html','/meanwhile-around-world-prototype.html','/overnight-work-ruler.html','/randomizer-tantrum-test.html','/ticker-bones-test.html']
          for path in private_paths:
              r=fetch(path,follow=False)
              ok(f'Internal surface blocked {path}', r['status'] in (404,410), f'got {r["status"]}')

          rr=fetch('/robots.txt'); rt=text(rr)
          ok('robots.txt 200',rr['status']==200,f'got {rr["status"]}')
          ok('robots.txt advertises sitemap','Sitemap: https://barbph.com/sitemap.xml' in rt)
          ok('robots.txt blocks functions','Disallow: /.netlify/functions/' in rt)
          sr=fetch('/sitemap.xml'); st=text(sr)
          urls=re.findall(r'<loc>(.*?)</loc>',st,re.I)
          expected=['https://barbph.com/','https://barbph.com/products','https://barbph.com/programs','https://barbph.com/publications','https://barbph.com/partnership']
          ok('sitemap.xml 200',sr['status']==200,f'got {sr["status"]}')
          ok('sitemap has exactly canonical five URLs',urls==expected,f'got {urls}')
          ok('sitemap contains no .html URLs',not any('.html' in u for u in urls))

          # Crawl same-origin links and image/script/style assets from canonical pages.
          local=set()
          for h in page_html.values():
              for attr,val in re.findall(r'\b(href|src)=["\']([^"\']+)["\']',h,re.I):
                  val=htmlmod.unescape(val).strip()
                  if not val or val.startswith(('#','mailto:','tel:','javascript:','data:')): continue
                  u=urllib.parse.urljoin(BASE+'/',val)
                  p=urllib.parse.urlsplit(u)
                  if p.netloc=='barbph.com':
                      local.add(p.path + (('?' + p.query) if p.query else ''))
          broken=[]
          for path in sorted(local):
              if path.startswith('/.netlify/functions/'): continue
              r=fetch(path)
              if r['status']>=400 or r['status']==0: broken.append((path,r['status'],r.get('error','')))
          ok('All discovered same-origin page/assets resolve',not broken,f'{broken[:15]}')
          INFO.append(f'Discovered and checked {len(local)} same-origin links/assets from canonical pages.')

          function_specs=[
            ('catalog products','/.netlify/functions/catalog-feed?type=products',200),
            ('catalog programs','/.netlify/functions/catalog-feed?type=programs',200),
            ('content feed','/.netlify/functions/content-feed',200),
            ('homepage priority','/.netlify/functions/homepage-priority',200),
            ('daily stream public','/.netlify/functions/daily-stream-public',200),
            ('systems public','/.netlify/functions/systems-public',200),
          ]
          for name,path,status in function_specs:
              r=fetch(path,timeout=35)
              ok(f'Function {name}',r['status']==status,f"got {r['status']} {r.get('error','')}")
              if r['status']==200:
                  try:
                      data=json.loads(text(r));
                      if name=='catalog products': ok('Products feed has published items',len(data.get('items',[]))>=1,f"{len(data.get('items',[]))}")
                      if name=='catalog programs': ok('Programs feed has published items',len(data.get('items',[]))>=1,f"{len(data.get('items',[]))}")
                      if name=='content feed': ok('Content feed contains publications',isinstance(data.get('publications'),list))
                      if name=='homepage priority': ok('Homepage priority reports OK',data.get('status')=='OK',str(data)[:300])
                  except Exception as e: FAIL.append(f'Function {name} returned invalid JSON: {e}')
              if name in ('catalog products','catalog programs','content feed') and r['status']==200:
                  cc=r['headers'].get('cache-control',''); ncc=r['headers'].get('netlify-cdn-cache-control','')
                  warn(f'Function {name} browser caching configured','max-age' in cc,cc)
                  warn(f'Function {name} CDN caching configured',bool(ncc),ncc)

          # partnership-info should be a single clean redirect, no .html hop.
          pr=fetch('/.netlify/functions/partnership-info',follow=False); ploc=pr['headers'].get('location','')
          ok('Partnership info function redirects',pr['status'] in (301,302,307,308),f'{pr["status"]} {ploc}')
          warn('Partnership info redirects directly to clean route','.html' not in ploc,ploc)

          for fn in ['google-form-probe','randomizer-tantrum-lab']:
              r=fetch('/.netlify/functions/'+fn,follow=False)
              ok(f'Internal function removed: {fn}',r['status']==404,f'got {r["status"]}')

          # Basic content consistency and duplicate SEO tags.
          for path,h in page_html.items():
              ok(f'{path} one canonical tag',len(re.findall(r'<link\b(?=[^>]*rel=["\']canonical["\'])',h,re.I))==1)
              ok(f'{path} one description meta',len(re.findall(r'<meta\b(?=[^>]*name=["\']description["\'])',h,re.I))==1)
              ok(f'{path} one og:title meta',len(re.findall(r'<meta\b(?=[^>]*property=["\']og:title["\'])',h,re.I))==1)

          report=[]
          report += ['# BarbPH Live Audit Report','',f'**Audit target:** {BASE}',f'**Audit cycle:** 1',f'**Generated UTC:** {time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime())}','']
          report += [f'## Summary','',f'- PASS checks: {len(PASS)}',f'- FAIL checks: {len(FAIL)}',f'- Warnings: {len(WARN)}','']
          report += ['## Failures',''] + ([f'- [ ] {x}' for x in FAIL] if FAIL else ['- None.']) + ['']
          report += ['## Warnings',''] + ([f'- [ ] {x}' for x in WARN] if WARN else ['- None.']) + ['']
          report += ['## Passed checks',''] + [f'- [x] {x}' for x in PASS] + ['']
          report += ['## Informational notes',''] + [f'- {x}' for x in INFO] + ['']
          Path('barbph-live-audit.md').write_text('\n'.join(report),encoding='utf-8')
          Path('barbph-live-audit.json').write_text(json.dumps({'pass':PASS,'fail':FAIL,'warn':WARN,'info':INFO,'snapshots':snapshots},indent=2),encoding='utf-8')
          print('\n'.join(report[:80]))
          if FAIL: raise SystemExit(1)
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barbph-live-audit-cycle-1
          path: |
            barbph-live-audit.md
            barbph-live-audit.json
          if-no-files-found: error
          retention-days: 1
