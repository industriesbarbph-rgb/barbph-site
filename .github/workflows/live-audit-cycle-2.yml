name: BarbPH Live Audit Cycle 2

on:
  push:
    paths:
      - ".github/workflows/live-audit-cycle-2.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run deeper live audit
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json, re, html as htmlmod, time
          from pathlib import Path

          BASE='https://barbph.com'
          PASS=[]; FAIL=[]; WARN=[]; INFO=[]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          follow=urllib.request.build_opener(); nofollow=urllib.request.build_opener(NoRedirect)

          def make_url(path):
              if path.startswith('http://') or path.startswith('https://'): return path
              p=urllib.parse.urlsplit(path)
              qp=urllib.parse.quote(p.path, safe='/%:@-._~()')
              return BASE+qp+(('?'+p.query) if p.query else '')

          def fetch(path, redirects=True, timeout=30):
              url=make_url(path)
              req=urllib.request.Request(url,headers={'User-Agent':'BarbPH-Live-Audit-Cycle2/2026-08-31','Accept':'*/*'})
              try:
                  with (follow if redirects else nofollow).open(req,timeout=timeout) as r:
                      return {'status':r.status,'url':url,'final':r.geturl(),'headers':{k.lower():v for k,v in r.headers.items()},'body':r.read()}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b''
                  return {'status':e.code,'url':url,'final':url,'headers':{k.lower():v for k,v in e.headers.items()},'body':b}
              except Exception as e:
                  return {'status':0,'url':url,'final':url,'headers':{},'body':b'','error':repr(e)}

          def txt(r): return r['body'].decode('utf-8','replace')
          def check(label,cond,detail=''):
              (PASS if cond else FAIL).append(label+(f': {detail}' if detail else '')); return cond
          def warning(label,cond,detail=''):
              if not cond: WARN.append(label+(f': {detail}' if detail else '')); return cond
          def title(h):
              m=re.search(r'<title>(.*?)</title>',h,re.I|re.S); return htmlmod.unescape(re.sub(r'\s+',' ',m.group(1))).strip() if m else ''
          def meta(h,attr,key):
              for tag in re.findall(r'<meta\b[^>]*>',h,re.I):
                  if re.search(rf'\b{attr}=["\']{re.escape(key)}["\']',tag,re.I):
                      m=re.search(r'\bcontent=["\']([^"\']*)',tag,re.I); return htmlmod.unescape(m.group(1)).strip() if m else ''
              return ''
          def canon(h):
              for tag in re.findall(r'<link\b[^>]*>',h,re.I):
                  if re.search(r'\brel=["\']canonical["\']',tag,re.I):
                      m=re.search(r'\bhref=["\']([^"\']*)',tag,re.I); return htmlmod.unescape(m.group(1)).strip() if m else ''
              return ''
          def h1s(h): return re.findall(r'<h1\b[^>]*>(.*?)</h1>',h,re.I|re.S)

          specs={
            '/':('BarbPH | Digital Assets, Coaching & Multidisciplinary Arts','https://barbph.com/','BarbPH | Digital Assets, Coaching Programs, Multidisciplinary Arts & Interactive Builds'),
            '/products':('Digital Assets | BarbPH','https://barbph.com/products','Digital Assets | BarbPH'),
            '/programs':('Coaching Programs | BarbPH','https://barbph.com/programs','Coaching Programs | BarbPH'),
            '/publications':('Publications & Bulletin | BarbPH','https://barbph.com/publications','Publications & Bulletin | BarbPH'),
            '/partnership':('Partnerships | BarbPH','https://barbph.com/partnership','Partnerships | BarbPH'),
          }
          pages={}
          for p,(et,ec,eo) in specs.items():
              r=fetch(p); h=txt(r); pages[p]=h
              check(f'{p} HTTP 200',r['status']==200,str(r['status']))
              check(f'{p} HTML content type','text/html' in r['headers'].get('content-type','').lower(),r['headers'].get('content-type',''))
              check(f'{p} title exact',title(h)==et,title(h))
              check(f'{p} canonical exact',canon(h)==ec,canon(h))
              check(f'{p} OG title exact',meta(h,'property','og:title')==eo,meta(h,'property','og:title'))
              check(f'{p} OG URL exact',meta(h,'property','og:url')==ec,meta(h,'property','og:url'))
              check(f'{p} Twitter card',meta(h,'name','twitter:card')=='summary_large_image',meta(h,'name','twitter:card'))
              check(f'{p} indexable robots','index' in meta(h,'name','robots').lower(),meta(h,'name','robots'))
              check(f'{p} one H1',len(h1s(h))==1,str(len(h1s(h))))
              check(f'{p} one canonical',len(re.findall(r'<link\b(?=[^>]*rel=["\']canonical["\'])',h,re.I))==1)
              check(f'{p} one description meta',len(re.findall(r'<meta\b(?=[^>]*name=["\']description["\'])',h,re.I))==1)
              check(f'{p} one OG title',len(re.findall(r'<meta\b(?=[^>]*property=["\']og:title["\'])',h,re.I))==1)
              check(f'{p} valid JSON-LD',all((lambda b: (json.loads(b),True)[1])(b) for b in re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',h,re.I|re.S)))
              check(f'{p} no mixed-content BarbPH refs','http://barbph.com' not in h.lower())
              check(f'{p} no localhost refs',not re.search(r'https?://(?:localhost|127\.0\.0\.1)',h,re.I))
              check(f'{p} no old admin sheet ID','1TSpt_DxEDhpsXE09lNx8S63b7cDomEXhVua--p99DGM' not in h)
              imgs=re.findall(r'<img\b[^>]*>',h,re.I); check(f'{p} all images have alt',all(re.search(r'\balt=["\']',x,re.I) for x in imgs),f'{len(imgs)} images')
              for hk in ('x-content-type-options','referrer-policy','permissions-policy','strict-transport-security'):
                  check(f'{p} header {hk}',bool(r['headers'].get(hk)),r['headers'].get(hk,''))

          home=pages['/']
          cdn=list(dict.fromkeys(re.findall(r'(\/\.netlify\/images\?[^"\'\s>]+)',home,re.I)))
          check('Five homepage Image CDN refs',len(cdn)>=5,str(len(cdn)))
          for i,u in enumerate(cdn[:5],1):
              r=fetch(htmlmod.unescape(u)); check(f'Image CDN asset {i} HTTP 200',r['status']==200,str(r['status'])); check(f'Image CDN asset {i} WebP','image/webp' in r['headers'].get('content-type','').lower(),r['headers'].get('content-type',''))

          # Social image and favicon assets.
          social=meta(home,'property','og:image')
          rs=fetch(social); check('OG social image HTTP 200',rs['status']==200,str(rs['status'])); check('OG social image is an image',rs['headers'].get('content-type','').lower().startswith('image/'),rs['headers'].get('content-type',''))
          for p in ['/favicon-32.png','/favicon-192.png','/apple-touch-icon.png']:
              r=fetch(p); check(f'{p} available',r['status']==200,str(r['status']))

          redirects={'/index.html':'/','/products.html':'/products','/programs.html':'/programs','/publications.html':'/publications','/partnership.html':'/partnership','/partnerships.html':'/partnership','/systems':'/?systems=open','/systems.html':'/?systems=open','/partnership-guide.html':'/partnership-guide','/ticker.html':'/ticker'}
          for p,target in redirects.items():
              r=fetch(p,False); loc=r['headers'].get('location',''); q=urllib.parse.urlsplit(loc); actual=(q.path or '')+(('?'+q.query) if q.query else '')
              check(f'{p} redirect status',r['status'] in (301,302,307,308),f'{r["status"]} {loc}'); check(f'{p} redirect target',actual==target,f'{actual} != {target}')

          for p in ['/partnership-guide','/ticker']:
              r=fetch(p); check(f'{p} helper 200',r['status']==200,str(r['status']))

          private=['/README.md','/ALIVE-FAB-SPEC.md','/BARBPH-LAUNCH-HARDENING-2026-08-21.md','/BARBPH-PROTOTYPE-AUDIT-2026-08-21.md','/BARBPH-SOURCE-OF-TRUTH.md','/DAILY-DISCOVER-PRODUCTION-ENGINE.md','/LAUNCH-AUDIT.txt','/alive-fab-test.html','/homepage-launch-test.html','/daily-discover-test.html','/daily-discover-production-test.html','/diagnostic-hardening-test.html','/homepage-priority-test.html','/meanwhile-around-world-prototype.html','/overnight-work-ruler.html','/randomizer-tantrum-test.html','/ticker-bones-test.html','/ticker-prebirth-test.html']
          for p in private:
              r=fetch(p,False); check(f'Private surface blocked {p}',r['status'] in (404,410),str(r['status']))

          rr=fetch('/robots.txt'); rt=txt(rr); check('robots 200',rr['status']==200); check('robots sitemap','Sitemap: https://barbph.com/sitemap.xml' in rt); check('robots function disallow','Disallow: /.netlify/functions/' in rt)
          sr=fetch('/sitemap.xml'); st=txt(sr); locs=re.findall(r'<loc>(.*?)</loc>',st,re.I); expected=[x[1] for x in specs.values()]
          check('sitemap 200',sr['status']==200); check('sitemap canonical set',locs==expected,str(locs)); check('sitemap has no private/test terms',not re.search(r'test|prototype|diagnostic|\.md|\.txt',st,re.I))

          # Corrected same-origin crawl. Skip template strings and encode URL paths.
          local=set(); skipped_templates=[]
          for h in pages.values():
              for _,v in re.findall(r'\b(href|src)=["\']([^"\']+)["\']',h,re.I):
                  v=htmlmod.unescape(v).strip()
                  if not v or v.startswith(('#','mailto:','tel:','javascript:','data:')): continue
                  if '${' in v or '}' in v or '{' in v:
                      skipped_templates.append(v); continue
                  u=urllib.parse.urljoin(BASE+'/',v); q=urllib.parse.urlsplit(u)
                  if q.netloc=='barbph.com': local.add(q.path+(('?'+q.query) if q.query else ''))
          broken=[]
          for p in sorted(local):
              if p.startswith('/.netlify/functions/'): continue
              r=fetch(p)
              if r['status']==0 or r['status']>=400: broken.append((p,r['status'],r.get('error','')))
          check('Corrected same-origin crawl clean',not broken,str(broken[:20])); INFO.append(f'Checked {len(local)} same-origin URLs; ignored {len(skipped_templates)} JavaScript template placeholders.')

          funcs=[('products','/.netlify/functions/catalog-feed?type=products'),('programs','/.netlify/functions/catalog-feed?type=programs'),('content','/.netlify/functions/content-feed'),('priority','/.netlify/functions/homepage-priority'),('daily stream','/.netlify/functions/daily-stream-public'),('systems','/.netlify/functions/systems-public')]
          for n,p in funcs:
              r=fetch(p,timeout=40); check(f'Function {n} 200',r['status']==200,f'{r["status"]} {r.get("error","")}')
              if r['status']==200:
                  try:d=json.loads(txt(r)); check(f'Function {n} JSON',isinstance(d,(dict,list)))
                  except Exception as e: FAIL.append(f'Function {n} invalid JSON: {e}')
          rp=fetch('/.netlify/functions/partnership-info',False); pl=rp['headers'].get('location',''); check('Partnership info redirect',rp['status'] in (301,302,307,308),f'{rp["status"]} {pl}'); check('Partnership info clean target','.html' not in pl and urllib.parse.urlsplit(pl).path=='/partnership-guide',pl)
          for n in ['google-form-probe','randomizer-tantrum-lab']:
              r=fetch('/.netlify/functions/'+n,False); check(f'Internal function {n} absent',r['status']==404,str(r['status']))

          # Basic markup hygiene.
          for p,h in pages.items():
              ids=re.findall(r'\bid=["\']([^"\']+)["\']',h,re.I); dup=sorted({x for x in ids if ids.count(x)>1})
              warning(f'{p} duplicate element IDs',not dup,str(dup[:15]))
              desc=meta(h,'name','description'); warning(f'{p} description <=160 chars',len(desc)<=160,f'{len(desc)} chars')

          report=['# BarbPH Live Audit Report','',f'**Audit target:** {BASE}',f'**Audit cycle:** 2',f'**Generated UTC:** {time.strftime("%Y-%m-%d %H:%M:%S UTC",time.gmtime())}','','## Summary','',f'- PASS checks: {len(PASS)}',f'- FAIL checks: {len(FAIL)}',f'- Warnings: {len(WARN)}','','## Failures','']
          report += [f'- [ ] {x}' for x in FAIL] if FAIL else ['- None.']
          report += ['','## Warnings',''] + ([f'- [ ] {x}' for x in WARN] if WARN else ['- None.'])
          report += ['','## Passed checks','']+[f'- [x] {x}' for x in PASS]+['','## Notes','']+[f'- {x}' for x in INFO]
          Path('barbph-live-audit-cycle-2.md').write_text('\n'.join(report),encoding='utf-8')
          Path('barbph-live-audit-cycle-2.json').write_text(json.dumps({'pass':PASS,'fail':FAIL,'warn':WARN,'info':INFO},indent=2),encoding='utf-8')
          print('\n'.join(report[:100]))
          if FAIL: raise SystemExit(1)
          PY

      - name: Upload cycle 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barbph-live-audit-cycle-2
          path: |
            barbph-live-audit-cycle-2.md
            barbph-live-audit-cycle-2.json
          if-no-files-found: error
          retention-days: 1
