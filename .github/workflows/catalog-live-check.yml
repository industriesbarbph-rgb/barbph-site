name: BarbPH Catalog Live Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-live-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Force-revalidate and check live catalog
        shell: bash
        run: |
          set -euo pipefail
          NORMAL_URL="https://barbph.com/.netlify/functions/catalog-feed?type=products"

          echo "--- FORCED REVALIDATION REQUEST ---"
          curl -fsSL -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D /tmp/forced.headers "$NORMAL_URL" -o /tmp/forced.json
          cat /tmp/forced.headers
          sleep 2

          echo "--- ORDINARY REQUEST AFTER REVALIDATION ---"
          curl -fsSL -D /tmp/normal.headers "$NORMAL_URL" -o /tmp/normal.json
          cat /tmp/normal.headers

          python - <<'PY'
          import json
          from pathlib import Path
          forced=json.loads(Path('/tmp/forced.json').read_text())
          normal=json.loads(Path('/tmp/normal.json').read_text())
          f=[x.get('name','') for x in forced.get('items',[])]
          n=[x.get('name','') for x in normal.get('items',[])]
          print('FORCED_COUNT=',len(f))
          print('NORMAL_COUNT=',len(n))
          print('NORMAL_NAMES=',n)
          PY
