name: BarbPH Catalog Live Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-live-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check fresh public sheet and live catalog
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date +%s)
          SHEET_URL="https://docs.google.com/spreadsheets/d/1NA3jrA3gdctbpfhXtz2TAiRGRFWsyWRTT6EvoJNIfUw/gviz/tq?tqx=out:csv&sheet=Products&headers=0&cb=${TS}"
          LIVE_URL="https://barbph.com/.netlify/functions/catalog-feed?type=products&cb=${TS}"
          NORMAL_URL="https://barbph.com/.netlify/functions/catalog-feed?type=products"

          curl -fsSL "$SHEET_URL" -o /tmp/products.csv
          curl -fsSL "$LIVE_URL" -o /tmp/live-fresh.json
          curl -fsSL "$NORMAL_URL" -o /tmp/live-normal.json

          python - <<'PY'
          import csv, json
          from pathlib import Path

          rows=list(csv.reader(Path('/tmp/products.csv').read_text(encoding='utf-8').splitlines()))
          hi=next(i for i,r in enumerate(rows) if r and r[0].strip().lower()=='name')
          heads=[x.strip() for x in rows[hi]]
          items=[]
          for r in rows[hi+1:]:
              d={h:(r[i].strip() if i<len(r) else '') for i,h in enumerate(heads)}
              if d.get('published','').lower()=='yes' and d.get('name','').strip(): items.append(d['name'].strip())

          fresh=json.loads(Path('/tmp/live-fresh.json').read_text())
          normal=json.loads(Path('/tmp/live-normal.json').read_text())
          fresh_names=[x.get('name','') for x in fresh.get('items',[])]
          normal_names=[x.get('name','') for x in normal.get('items',[])]

          print('SHEET_COUNT=',len(items))
          print('SHEET_NAMES=',items)
          print('FRESH_FUNCTION_COUNT=',len(fresh_names))
          print('FRESH_FUNCTION_NAMES=',fresh_names)
          print('NORMAL_FUNCTION_COUNT=',len(normal_names))
          print('NORMAL_FUNCTION_NAMES=',normal_names)

          expected={'The Pendant Light Lounge','Dupli Tron 526','Night Sky','No Human Conversation'}
          missing_sheet=expected-set(items)
          missing_fresh=expected-set(fresh_names)
          if missing_sheet: raise SystemExit(f'Missing from public sheet: {sorted(missing_sheet)}')
          if missing_fresh: raise SystemExit(f'Missing from fresh live function: {sorted(missing_fresh)}')
          if len(items)!=19: raise SystemExit(f'Expected 19 valid published products in public sheet, got {len(items)}')
          if len(fresh_names)!=19: raise SystemExit(f'Expected 19 products in fresh live function, got {len(fresh_names)}')
          PY
