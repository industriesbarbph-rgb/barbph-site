name: BarbPH Final Live Audit Cycle 3

on:
  push:
    paths:
      - ".github/workflows/live-audit-cycle-3.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run final comprehensive live audit
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json, re, html as htmlmod, time
          from pathlib import Path

          BASE='https://barbph.com'
          PASS=[]; FAIL=[]; WARN=[]; INFO=[]
          OLD_SID='1TSpt_DxEDhpsXE09lNx8S63b7cDomEXhVua--p99DGM'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          follow=urllib.request.build_opener(); nofollow=urllib.request.build_opener(NoRedirect)

          def make_url(path):
              if path.startswith(('http://','https://')): return path
              p=urllib.parse.urlsplit(path)
              qp=urllib.parse.quote(p.path, safe='/%:@-._~()')
              return BASE+qp+(('?'+p.query) if p.query else '')

          def fetch(path, redirects=True, timeout=35):
              url=make_url(path)
              req=urllib.request.Request(url,headers={'User-Agent':'BarbPH-Final-Audit/2026-08-31','Accept':'*/*'})
              try:
                  with (follow if redirects else nofollow).open(req,timeout=timeout) as r:
                      return {'status':r.status,'url':url,'final':r.geturl(),'headers':{k.lower():v for k,v in r.headers.items()},'body':r.read()}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b''
                  return {'status':e.code,'url':url,'final':url,'headers':{k.lower():v for k,v in e.headers.items()},'body':b}
              except Exception as e:
                  return {'status':0,'url':url,'final':url,'headers':{},'body':b'','error':repr(e)}

          def txt(r): return r['body'].decode('utf-8','replace')
          def check(label,cond,detail=''):
              (PASS if cond else FAIL).append(label+(f': {detail}' if detail else '')); return cond
          def note(label,cond,detail=''):
              if not cond: WARN.append(label+(f': {detail}' if detail else '')); return cond

          def strip_script_style(h):
              h=re.sub(r'<script\b[^>]*>[\s\S]*?</script>','',h,flags=re.I)
              h=re.sub(r'<style\b[^>]*>[\s\S]*?</style>','',h,flags=re.I)
              return h
          def title(h):
              m=re.search(r'<title>(.*?)</title>',h,re.I|re.S); return htmlmod.unescape(re.sub(r'\s+',' ',m.group(1))).strip() if m else ''
          def meta(h,attr,key):
              for tag in re.findall(r'<meta\b[^>]*>',h,re.I):
                  if re.search(rf'\b{attr}=["\']{re.escape(key)}["\']',tag,re.I):
                      m=re.search(r'\bcontent=["\']([^"\']*)',tag,re.I); return htmlmod.unescape(m.group(1)).strip() if m else ''
              return ''
          def canon(h):
              for tag in re.findall(r'<link\b[^>]*>',h,re.I):
                  if re.search(r'\brel=["\']canonical["\']',tag,re.I):
                      m=re.search(r'\bhref=["\']([^"\']*)',tag,re.I); return htmlmod.unescape(m.group(1)).strip() if m else ''
              return ''
          def clean_text(fragment): return htmlmod.unescape(re.sub(r'<[^>]+>',' ',fragment)).strip()

          specs={
            '/':('BarbPH | Digital Assets, Coaching & Multidisciplinary Arts','https://barbph.com/','BarbPH | Digital Assets, Coaching Programs, Multidisciplinary Arts & Interactive Builds'),
            '/products':('Digital Assets | BarbPH','https://barbph.com/products','Digital Assets | BarbPH'),
            '/programs':('Coaching Programs | BarbPH','https://barbph.com/programs','Coaching Programs | BarbPH'),
            '/publications':('Publications & Bulletin | BarbPH','https://barbph.com/publications','Publications & Bulletin | BarbPH'),
            '/partnership':('Partnerships | BarbPH','https://barbph.com/partnership','Partnerships | BarbPH'),
          }
          pages={}; responses={}
          for p,(et,ec,eo) in specs.items():
              r=fetch(p); h=txt(r); pages[p]=h; responses[p]=r; visible=strip_script_style(h)
              check(f'{p} HTTP 200',r['status']==200,str(r['status']))
              check(f'{p} remains on canonical clean URL',urllib.parse.urlsplit(r['final']).path in (urllib.parse.urlsplit(ec).path,''),r['final'])
              check(f'{p} HTML content type','text/html' in r['headers'].get('content-type','').lower(),r['headers'].get('content-type',''))
              check(f'{p} UTF-8 charset declaration',bool(re.search(r'<meta\b[^>]*charset=["\']?utf-8',h,re.I)))
              check(f'{p} viewport meta',bool(meta(h,'name','viewport')))
              check(f'{p} html lang',bool(re.search(r'<html\b[^>]*\blang=["\'][^"\']+',h,re.I)))
              check(f'{p} title exact',title(h)==et,title(h))
              check(f'{p} canonical exact',canon(h)==ec,canon(h))
              check(f'{p} OG title exact',meta(h,'property','og:title')==eo,meta(h,'property','og:title'))
              check(f'{p} OG URL exact',meta(h,'property','og:url')==ec,meta(h,'property','og:url'))
              check(f'{p} OG image HTTPS',meta(h,'property','og:image').startswith('https://'),meta(h,'property','og:image'))
              check(f'{p} Twitter card',meta(h,'name','twitter:card')=='summary_large_image',meta(h,'name','twitter:card'))
              check(f'{p} indexable robots','index' in meta(h,'name','robots').lower(),meta(h,'name','robots'))
              desc=meta(h,'name','description'); check(f'{p} useful description',50 <= len(desc) <= 160,f'{len(desc)} chars')
              h1=re.findall(r'<h1\b[^>]*>(.*?)</h1>',visible,re.I|re.S); check(f'{p} one visible-markup H1',len(h1)==1,str(len(h1)))
              check(f'{p} one canonical',len(re.findall(r'<link\b(?=[^>]*rel=["\']canonical["\'])',h,re.I))==1)
              check(f'{p} one description meta',len(re.findall(r'<meta\b(?=[^>]*name=["\']description["\'])',h,re.I))==1)
              check(f'{p} one OG title',len(re.findall(r'<meta\b(?=[^>]*property=["\']og:title["\'])',h,re.I))==1)
              blocks=re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',h,re.I|re.S)
              check(f'{p} structured data present',len(blocks)>=1,str(len(blocks)))
              for i,b in enumerate(blocks,1):
                  try: json.loads(b); PASS.append(f'{p} JSON-LD block {i} parses')
                  except Exception as e: FAIL.append(f'{p} JSON-LD block {i} invalid: {e}')
              check(f'{p} no mixed content',not re.search(r'http://(?:www\.)?barbph\.com',h,re.I))
              check(f'{p} no localhost refs',not re.search(r'https?://(?:localhost|127\.0\.0\.1)',h,re.I))
              check(f'{p} no old admin sheet ID',OLD_SID not in h)
              check(f'{p} no direct internal .html navigation',not re.search(r'href=["\'](?:/)?(?:products|programs|publications|partnership|index)\.html',visible,re.I))
              imgs=re.findall(r'<img\b[^>]*>',visible,re.I)
              check(f'{p} all rendered-markup images have alt',all(re.search(r'\balt=["\']',x,re.I) for x in imgs),f'{len(imgs)} images')
              ids=[x for x in re.findall(r'\bid=["\']([^"\']+)["\']',visible,re.I) if '${' not in x and '{' not in x and '}' not in x]
              dup=sorted({x for x in ids if ids.count(x)>1})
              check(f'{p} no duplicate literal element IDs',not dup,str(dup[:15]))
              # Basic interactive-name check on literal markup only.
              empty_buttons=[]
              for attrs,body in re.findall(r'<button\b([^>]*)>(.*?)</button>',visible,re.I|re.S):
                  label=clean_text(body)
                  if not label and not re.search(r'\baria-label=["\'][^"\']+',attrs,re.I) and not re.search(r'\btitle=["\'][^"\']+',attrs,re.I): empty_buttons.append(attrs[:100])
              check(f'{p} buttons have accessible text/name',not empty_buttons,str(empty_buttons[:5]))
              for hk in ('x-content-type-options','referrer-policy','permissions-policy','strict-transport-security'):
                  check(f'{p} header {hk}',bool(r['headers'].get(hk)),r['headers'].get(hk,''))

          home=pages['/']; home_visible=strip_script_style(home)
          cdn=list(dict.fromkeys(re.findall(r'(\/\.netlify\/images\?[^"\'\s>]+)',home,re.I)))
          check('Homepage has at least five Image CDN refs',len(cdn)>=5,str(len(cdn)))
          for i,u in enumerate(cdn[:5],1):
              r=fetch(htmlmod.unescape(u)); check(f'Image CDN {i} HTTP 200',r['status']==200,str(r['status'])); check(f'Image CDN {i} WebP','image/webp' in r['headers'].get('content-type','').lower(),r['headers'].get('content-type',''))
          heavy_names=['ChatGPT Image Aug 22, 2026, 06_25_20 PM (1)(1).png','ChatGPT Image Aug 22, 2026, 06_40_38 PM(1).png','ChatGPT Image Aug 22, 2026, 06_40_45 PM(1).png','ChatGPT Image Aug 22, 2026, 06_39_58 PM (1)(1).png','ChatGPT Image Aug 22, 2026, 06_39_59 PM (3)(1).png']
          check('Homepage no longer directly sources five heavy PNGs',all((f'src="{n}"' not in home and f"src='{n}'" not in home) for n in heavy_names))

          # Validate explicit data-webp fallbacks and CSS url() same-origin assets.
          extra_assets=set()
          for h in pages.values():
              for v in re.findall(r'\bdata-webp=["\']([^"\']+)["\']',h,re.I):
                  if '${' not in v and '{' not in v: extra_assets.add(v)
              for v in re.findall(r'url\(["\']?([^\)"\']+)',h,re.I):
                  v=htmlmod.unescape(v).strip()
                  if not v.startswith(('data:','http://','https://')) and '${' not in v and '{' not in v: extra_assets.add(v)
          broken_extra=[]
          for v in sorted(extra_assets):
              u=urllib.parse.urljoin(BASE+'/',v); q=urllib.parse.urlsplit(u)
              if q.netloc!='barbph.com': continue
              r=fetch(q.path+(('?'+q.query) if q.query else ''))
              if r['status']>=400 or r['status']==0: broken_extra.append((v,r['status'],r.get('error','')))
          check('data-webp and inline CSS local assets resolve',not broken_extra,str(broken_extra[:20]))

          # Social and icon assets.
          social=meta(home,'property','og:image'); r=fetch(social)
          check('Social image HTTP 200',r['status']==200,str(r['status'])); check('Social image MIME is image',r['headers'].get('content-type','').lower().startswith('image/'),r['headers'].get('content-type',''))
          for p in ['/favicon-32.png','/favicon-192.png','/apple-touch-icon.png']:
              r=fetch(p); check(f'{p} HTTP 200',r['status']==200,str(r['status']))

          redirects={'/index.html':'/','/products.html':'/products','/programs.html':'/programs','/publications.html':'/publications','/partnership.html':'/partnership','/partnerships':'/partnership','/partnerships.html':'/partnership','/systems':'/?systems=open','/systems.html':'/?systems=open','/partnership-guide.html':'/partnership-guide','/ticker.html':'/ticker'}
          for p,target in redirects.items():
              r=fetch(p,False); loc=r['headers'].get('location',''); q=urllib.parse.urlsplit(loc); actual=(q.path or '')+(('?'+q.query) if q.query else '')
              check(f'{p} redirect status',r['status'] in (301,302,307,308),f'{r["status"]} {loc}'); check(f'{p} redirect target',actual==target,f'{actual} != {target}')
          for p in ['/partnership-guide','/ticker']:
              r=fetch(p); check(f'{p} helper 200',r['status']==200,str(r['status']))

          # Public surface privacy, including build/config files and one-time workflow paths.
          private=[
            '/README.md','/ALIVE-FAB-SPEC.md','/BARBPH-LAUNCH-HARDENING-2026-08-21.md','/BARBPH-PROTOTYPE-AUDIT-2026-08-21.md','/BARBPH-SOURCE-OF-TRUTH.md','/DAILY-DISCOVER-PRODUCTION-ENGINE.md','/LAUNCH-AUDIT.txt',
            '/alive-fab-test.html','/homepage-launch-test.html','/daily-discover-test.html','/daily-discover-production-test.html','/diagnostic-hardening-test.html','/homepage-priority-test.html','/meanwhile-around-world-prototype.html','/overnight-work-ruler.html','/randomizer-tantrum-test.html','/ticker-bones-test.html','/ticker-prebirth-test.html',
            '/netlify.toml','/build-site.js','/post-build-fix.js','/build-catalog.js','/package.json','/package-lock.json','/.github/workflows/rebuild.yml','/.github/workflows/live-audit-once.yml'
          ]
          for p in private:
              r=fetch(p,False); check(f'Private/build surface blocked {p}',r['status'] in (404,410),str(r['status']))
          bogus='/barbph-audit-definitely-not-a-real-route-20260831'; r=fetch(bogus,False); check('Unknown routes return 404',r['status']==404,str(r['status']))

          rr=fetch('/robots.txt'); rt=txt(rr); check('robots HTTP 200',rr['status']==200); check('robots sitemap exact','Sitemap: https://barbph.com/sitemap.xml' in rt); check('robots functions disallowed','Disallow: /.netlify/functions/' in rt)
          sr=fetch('/sitemap.xml'); st=txt(sr); locs=re.findall(r'<loc>(.*?)</loc>',st,re.I); expected=[x[1] for x in specs.values()]
          check('sitemap HTTP 200',sr['status']==200); check('sitemap exactly canonical five',locs==expected,str(locs)); check('sitemap excludes private/test terms',not re.search(r'test|prototype|diagnostic|\.md|\.txt|\.html',st,re.I))

          # Same-origin href/src crawl with template filtering and URL encoding.
          local=set(); templates=0
          for h in pages.values():
              for _,v in re.findall(r'\b(href|src)=["\']([^"\']+)["\']',h,re.I):
                  v=htmlmod.unescape(v).strip()
                  if not v or v.startswith(('#','mailto:','tel:','javascript:','data:')): continue
                  if '${' in v or '{' in v or '}' in v: templates+=1; continue
                  u=urllib.parse.urljoin(BASE+'/',v); q=urllib.parse.urlsplit(u)
                  if q.netloc=='barbph.com': local.add(q.path+(('?'+q.query) if q.query else ''))
          broken=[]
          for p in sorted(local):
              if p.startswith('/.netlify/functions/'): continue
              r=fetch(p)
              if r['status']==0 or r['status']>=400: broken.append((p,r['status'],r.get('error','')))
          check('Same-origin href/src crawl clean',not broken,str(broken[:20])); INFO.append(f'Checked {len(local)} same-origin href/src URLs and ignored {templates} source template placeholders.')

          # Critical runtime functions and payload hygiene.
          funcs=[('products','/.netlify/functions/catalog-feed?type=products'),('programs','/.netlify/functions/catalog-feed?type=programs'),('content','/.netlify/functions/content-feed'),('priority','/.netlify/functions/homepage-priority'),('daily stream','/.netlify/functions/daily-stream-public'),('systems','/.netlify/functions/systems-public')]
          for n,p in funcs:
              r=fetch(p,timeout=45); body=txt(r); check(f'Function {n} HTTP 200',r['status']==200,f'{r["status"]} {r.get("error","")}'); check(f'Function {n} does not expose old admin ID',OLD_SID not in body)
              if r['status']==200:
                  try:d=json.loads(body); PASS.append(f'Function {n} JSON parses')
                  except Exception as e: FAIL.append(f'Function {n} invalid JSON: {e}'); continue
                  if n=='products': check('Products feed contains 15 published items',len(d.get('items',[]))==15,str(len(d.get('items',[]))))
                  if n=='programs': check('Programs feed contains 5 published items',len(d.get('items',[]))==5,str(len(d.get('items',[]))))
                  if n=='content': check('Content feed publications is a list',isinstance(d.get('publications'),list))
                  if n=='priority': check('Homepage priority status OK',d.get('status')=='OK',str(d)[:300])
          rp=fetch('/.netlify/functions/partnership-info',False); pl=rp['headers'].get('location','')
          check('Partnership info redirect status',rp['status'] in (301,302,307,308),f'{rp["status"]} {pl}'); check('Partnership info direct clean target',urllib.parse.urlsplit(pl).path=='/partnership-guide' and '.html' not in pl,pl)
          for n in ['google-form-probe','randomizer-tantrum-lab']:
              r=fetch('/.netlify/functions/'+n,False); check(f'Internal function {n} absent',r['status']==404,str(r['status']))

          # Static catalog sanity.
          product_names=re.findall(r'class=["\'][^"\']*card-name[^"\']*["\'][^>]*>(.*?)</',pages['/products'],re.I|re.S)
          program_names=re.findall(r'class=["\'][^"\']*program-name[^"\']*["\'][^>]*>(.*?)</',pages['/programs'],re.I|re.S)
          INFO.append(f'Static product-name markers found: {len(product_names)}. Static program-name markers found: {len(program_names)}.')

          # Ensure no unexpected warnings remain. Everything uncertain is informational, not silently ignored.
          report=['# BarbPH Live Audit Report','',f'**Audit target:** {BASE}',f'**Audit cycle:** 3 final gate',f'**Generated UTC:** {time.strftime("%Y-%m-%d %H:%M:%S UTC",time.gmtime())}','','## Summary','',f'- PASS checks: {len(PASS)}',f'- FAIL checks: {len(FAIL)}',f'- Warnings: {len(WARN)}','','## Failures','']
          report += [f'- [ ] {x}' for x in FAIL] if FAIL else ['- None.']
          report += ['','## Warnings',''] + ([f'- [ ] {x}' for x in WARN] if WARN else ['- None.'])
          report += ['','## Passed checks','']+[f'- [x] {x}' for x in PASS]+['','## Informational notes','']+[f'- {x}' for x in INFO]
          Path('barbph-live-audit-cycle-3.md').write_text('\n'.join(report),encoding='utf-8')
          Path('barbph-live-audit-cycle-3.json').write_text(json.dumps({'pass':PASS,'fail':FAIL,'warn':WARN,'info':INFO},indent=2),encoding='utf-8')
          print('\n'.join(report[:120]))
          if FAIL or WARN: raise SystemExit(1)
          PY

      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barbph-live-audit-cycle-3
          path: |
            barbph-live-audit-cycle-3.md
            barbph-live-audit-cycle-3.json
          if-no-files-found: error
          retention-days: 1
