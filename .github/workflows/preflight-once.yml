name: BarbPH Production Preflight Once

on:
  push:
    paths:
      - ".github/workflows/preflight-once.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repair robots.txt false-positives in both privacy guards
        run: |
          node - <<'NODE'
          const fs = require('fs');

          {
            const file = 'build-site.js';
            let text = fs.readFileSync(file, 'utf8');
            const oldLine = "  const leaks = publicFiles.filter(f => /\\.(md|txt)$/i.test(f) || INTERNAL_HTML.test(path.basename(f)) || f.includes(`${path.sep}overnight-work-log${path.sep}`));";
            const newLine = "  const leaks = publicFiles.filter(f => ((/\\.(md|txt)$/i.test(f)) && path.basename(f).toLowerCase() !== 'robots.txt') || INTERNAL_HTML.test(path.basename(f)) || f.includes(`${path.sep}overnight-work-log${path.sep}`));";
            if (!text.includes(oldLine) && !text.includes(newLine)) throw new Error('Expected build-site privacy-guard line was not found.');
            text = text.replace(oldLine, newLine);
            fs.writeFileSync(file, text);
          }

          {
            const file = 'post-build-fix.js';
            let text = fs.readFileSync(file, 'utf8');
            const oldLine = "    || /\\.(?:md|txt|ya?ml)$/i.test(rel)";
            const newLine = "    || (/\\.(?:md|txt|ya?ml)$/i.test(rel) && rel.toLowerCase() !== 'robots.txt')";
            if (!text.includes(oldLine) && !text.includes(newLine)) throw new Error('Expected post-build privacy-guard line was not found.');
            text = text.replace(oldLine, newLine);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Run production build and built-in preflight
        run: |
          node build-site.js
          node post-build-fix.js

      - name: Syntax-check deployed JavaScript
        run: |
          set -e
          find dist-functions -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: Verify production privacy and migration guards
        run: |
          set -e
          test -f dist/index.html
          test -f dist/products.html
          test -f dist/programs.html
          test -f dist/publications.html
          test -f dist/partnership.html
          ! grep -R -F '1TSpt_DxEDhpsXE09lNx8S63b7cDomEXhVua--p99DGM' dist-functions
          ! find dist -type f \( -name '*.md' -o -name 'partnerships.html' -o -name '*test*.html' -o -name '*prototype*.html' -o -name '*diagnostic*.html' \) | grep .
          grep -F 'BarbPH | Digital Assets, Coaching Programs, Multidisciplinary Arts & Interactive Builds' dist/index.html
          grep -F 'https://barbph.com/sitemap.xml' dist/robots.txt
          grep -F 'https://barbph.com/products' dist/sitemap.xml

      - name: Commit guard fixes only after all checks pass
        run: |
          git config user.name "barbph-preflight"
          git config user.email "actions@github.com"
          git add build-site.js post-build-fix.js
          if git diff --cached --quiet; then
            echo "Guard fixes already present."
          else
            git commit -m "Fix BarbPH production privacy guards [skip netlify]"
            git push
          fi

      - name: Package passed build for audit
        run: zip -qr barbph-preflight-output.zip dist dist-functions netlify.toml

      - name: Upload passed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: barbph-preflight-output
          path: barbph-preflight-output.zip
          if-no-files-found: error
          retention-days: 1
