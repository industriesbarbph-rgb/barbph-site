name: Watch Tower Static 28 check

on:
  push:
    branches: [watchtower-static-28-prep2]
    paths:
      - 'watchtower/**'
      - '.github/workflows/watchtower-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchtower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Build exact 28-camera static Watch Tower
        run: npm run build
      - name: Verify output contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const manifest = JSON.parse(fs.readFileSync('public/build-manifest.json', 'utf8'));
          const html = fs.readFileSync('public/global-sky.html', 'utf8');
          const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
          const ids = [...html.matchAll(/camera_id:'([^']+)'/g)].map(m => m[1]);
          const unique = new Set(ids);
          const exactTokyoAttribution = '著作権者: (一社)大手町・丸の内・有楽町地区まちづくり協議会';
          const canonical = 'https://watchtower.barbph.com/';
          const previewUrl = 'https://watchtower.barbph.com/global-sky-social-preview.png';

          if (manifest.total_camera_count !== 28 || manifest.added_camera_count !== 7) throw new Error('28-camera contract failed');
          if (JSON.stringify(manifest.accepted_source_camera_counts) !== JSON.stringify([21,28])) throw new Error('future 21/28 rebuild guard missing');
          if (manifest.camera_sets !== 4 || manifest.rotation_minutes !== 2) throw new Error('rotation/set contract failed');
          if (manifest.scout !== false || manifest.ledger !== false || manifest.backend_api !== false || manifest.functions !== false) throw new Error('static-only contract failed');
          if (manifest.broadcast_id_desk !== true) throw new Error('Broadcast ID desk must remain');
          if (manifest.tokyo_station_attribution !== true) throw new Error('Tokyo Station attribution flag missing');
          if (manifest.social_preview?.width !== 1447 || manifest.social_preview?.height !== 702) throw new Error('social preview dimensions wrong');
          if (unique.size !== 28) throw new Error(`expected 28 unique cameras, got ${unique.size}`);
          if (!html.includes('const SET_INTERVAL_MS = 2 * 60 * 1000;')) throw new Error('2-minute rotation constant missing');
          if (!html.includes('CAM-FI-ROVANIEMI-CS-6452')) throw new Error('Rovaniemi was lost');
          if (!html.includes('GLOBAL SKY DESK')) throw new Error('Broadcast ID desk missing');

          if (!html.includes(exactTokyoAttribution)) throw new Error('exact Tokyo Station copyright-holder wording missing');
          if (!html.includes('feed-attribution') || !html.includes('feed-focus-attribution')) throw new Error('Tokyo attribution is not visible in both panel and focus views');
          if ((html.match(/panel\.appendChild\(feedAttribution\);/g) || []).length !== 2) throw new Error('feed attribution is not attached to both image and iframe panel paths');
          if (html.includes('© Otemachi–Marunouchi–Yurakucho District Council')) throw new Error('translated Tokyo attribution still remains');

          if (!html.includes(`<link rel="canonical" href="${canonical}">`)) throw new Error('static canonical missing');
          if (!html.includes(`<meta property="og:url" content="${canonical}">`)) throw new Error('static og:url missing');
          if (!html.includes(`<meta property="og:image" content="${previewUrl}">`)) throw new Error('absolute og:image missing');
          if (!html.includes(`<meta name="twitter:image" content="${previewUrl}">`)) throw new Error('absolute twitter:image missing');
          if (!html.includes('<meta property="og:image:width" content="1447">') || !html.includes('<meta property="og:image:height" content="702">')) throw new Error('OG dimensions wrong');
          if (html.includes('location.origin + location.pathname') || html.includes('absolutePreview = location.origin')) throw new Error('dynamic social/canonical metadata code remains');
          if ((html.match(/rel="canonical"/g) || []).length !== 1) throw new Error('canonical tag is duplicated');
          if ((html.match(/property="og:url"/g) || []).length !== 1) throw new Error('og:url is duplicated');

          if (!fs.existsSync('public/robots.txt') || !fs.existsSync('public/sitemap.xml')) throw new Error('SEO support files missing');
          if (!sitemap.includes('<loc>https://watchtower.barbph.com/</loc>')) throw new Error('canonical sitemap URL missing');
          if (sitemap.includes('/global-sky.html')) throw new Error('duplicate non-canonical sitemap URL remains');
          if ((sitemap.match(/<url>/g) || []).length !== 1) throw new Error('sitemap must contain exactly one canonical URL');
          if (!fs.existsSync('public/global-sky-social-preview.png')) throw new Error('social preview PNG missing');

          const png = fs.readFileSync('public/global-sky-social-preview.png');
          if (png.subarray(0,8).toString('hex') !== '89504e470d0a1a0a') throw new Error('social preview is not PNG');
          if (png.readUInt32BE(16) !== 1447 || png.readUInt32BE(20) !== 702) throw new Error('social preview PNG dimensions wrong');
          let off = 8, width, height, bitDepth, colorType, interlace, idats = [];
          while (off < png.length) {
            const len = png.readUInt32BE(off), type = png.toString('ascii', off + 4, off + 8), data = png.subarray(off + 8, off + 8 + len);
            off += 12 + len;
            if (type === 'IHDR') { width=data.readUInt32BE(0); height=data.readUInt32BE(4); bitDepth=data[8]; colorType=data[9]; interlace=data[12]; }
            if (type === 'IDAT') idats.push(data);
            if (type === 'IEND') break;
          }
          if (bitDepth !== 8 || colorType !== 6 || interlace !== 0) throw new Error(`unexpected preview PNG format ${bitDepth}/${colorType}/${interlace}`);
          const raw = zlib.inflateSync(Buffer.concat(idats)), bpp = 4, stride = width * bpp, pixels = Buffer.alloc(stride * height); let ri = 0;
          const paeth = (a,b,c) => { const p=a+b-c, pa=Math.abs(p-a), pb=Math.abs(p-b), pc=Math.abs(p-c); return pa<=pb&&pa<=pc?a:pb<=pc?b:c; };
          for (let y=0; y<height; y++) {
            const filter = raw[ri++], row = pixels.subarray(y*stride,(y+1)*stride), prev = y ? pixels.subarray((y-1)*stride,y*stride) : null;
            for (let x=0; x<stride; x++) {
              const val=raw[ri++], a=x>=bpp?row[x-bpp]:0, up=prev?prev[x]:0, c=prev&&x>=bpp?prev[x-bpp]:0;
              const predictor = filter===0?0:filter===1?a:filter===2?up:filter===3?Math.floor((a+up)/2):filter===4?paeth(a,up,c):null;
              if (predictor === null) throw new Error(`unsupported PNG filter ${filter}`);
              row[x]=(val+predictor)&255;
            }
          }
          const pixelHash = crypto.createHash('sha256').update(pixels).digest('hex');
          if (pixelHash !== 'ea99d008cffcdee150a67836d2aea246aaca72835b6d096d94fdc7f1d23793f8') throw new Error(`social preview pixels differ from user-supplied PNG: ${pixelHash}`);

          for (const forbidden of ['/api/','ledgerOnline','receipt-view','receipt-mode','renderReceipt','initReceiptView','open-broadcast-receipt','openCurrentReceipt']) {
            if (html.includes(forbidden)) throw new Error(`ledger/backend residue remains: ${forbidden}`);
          }
          if (fs.existsSync('netlify/functions')) throw new Error('Netlify Functions directory still exists');
          for (const expected of [
            'EMBEDDED_CAMERA_SET[0],\n            VERIFIED_CAMERA_ADDITIONS_20260905[0]',
            'VERIFIED_CAMERA_SET_B[5],\n            VERIFIED_CAMERA_ADDITIONS_20260905[1]',
            'VERIFIED_CAMERA_ADDITIONS_20260905[2],\n            VERIFIED_CAMERA_ADDITIONS_20260905[4]',
            'VERIFIED_CAMERA_ADDITIONS_20260905[5],\n            EMBEDDED_CAMERA_SET[4]'
          ]) if (!html.includes(expected)) throw new Error('distributed camera-set contract failed');
          console.log(`Verified release contract: static 28, four distributed sets, exact owner attribution on-panel/focus, hard-coded canonical/social metadata, canonical-only sitemap, exact user-preview pixels ${pixelHash}, no Scout/ledger/API/functions.`);
          NODE
      - name: Verify next deployment can rebuild from the 28-camera page
        run: |
          cp public/global-sky.html /tmp/global-sky-28.html
          rm -rf public
          GLOBAL_SKY_SOURCE_FILE=/tmp/global-sky-28.html npm run build
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/global-sky.html', 'utf8');
          const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
          const ids = new Set([...html.matchAll(/camera_id:'([^']+)'/g)].map(m => m[1]));
          const exactTokyoAttribution = '著作権者: (一社)大手町・丸の内・有楽町地区まちづくり協議会';
          if (ids.size !== 28) throw new Error(`future rebuild produced ${ids.size} cameras`);
          if ((html.match(/const VERIFIED_CAMERA_ADDITIONS_20260905/g) || []).length !== 1) throw new Error('future rebuild duplicated additions');
          if ((html.match(/const VERIFIED_CAMERA_INVENTORY/g) || []).length !== 1) throw new Error('future rebuild duplicated inventory');
          if (html.includes('/api/') || html.includes('receipt-view')) throw new Error('future rebuild restored backend/ledger residue');
          if (!fs.existsSync('public/global-sky-social-preview.png')) throw new Error('future rebuild lost social preview');
          if (!html.includes(exactTokyoAttribution) || !html.includes('feed-attribution') || !html.includes('feed-focus-attribution')) throw new Error('future rebuild lost exact visible attribution');
          if (!html.includes('<link rel="canonical" href="https://watchtower.barbph.com/">')) throw new Error('future rebuild lost canonical');
          if (!html.includes('<meta property="og:url" content="https://watchtower.barbph.com/">')) throw new Error('future rebuild lost og:url');
          if (!html.includes('<meta property="og:image" content="https://watchtower.barbph.com/global-sky-social-preview.png">')) throw new Error('future rebuild lost absolute og:image');
          if (sitemap.includes('/global-sky.html') || (sitemap.match(/<url>/g) || []).length !== 1) throw new Error('future rebuild restored duplicate sitemap URL');
          console.log('Verified: a later deployment can safely rebuild from the live 28-camera page without losing final release hardening.');
          NODE
