name: Watch Tower Production Release Check

on:
  push:
    branches: [watchtower-camera-scout]
    paths:
      - 'watchtower/**'
      - '.github/workflows/watchtower-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchtower-production-release-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchtower
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: npm run check

      - name: Build and audit 50-camera Watch Tower
        run: npm run build

      - name: Verify September 12 release contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/global-sky.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('public/build-manifest.json', 'utf8'));
          const ids = [...html.matchAll(/camera_id:'([^']+)'/g)].map(m => m[1]).filter(id => id.startsWith('CAM-'));
          const unique = new Set(ids);

          if (unique.size !== 50) throw new Error(`expected 50 unique cameras, got ${unique.size}`);
          if (ids.length !== unique.size) throw new Error('duplicate camera IDs found');
          if (manifest.total_camera_count !== 50) throw new Error('manifest camera count is not 50');
          if (manifest.release_camera_additions_20260912 !== 21) throw new Error('September 12 addition count is not 21');
          if (!manifest.behind_cameras_note) throw new Error('Behind the Cameras note flag missing');
          if (!html.includes('BEHIND THE CAMERAS')) throw new Error('Behind the Cameras note missing');
          if (!html.includes('id="behind-cameras-note"') || !html.includes('target="_blank"')) throw new Error('Static Google Doc note/link contract missing');
          if (html.includes('id="behind-cameras-note-loader"') || html.includes('__behindCamerasStableRenderer')) throw new Error('Legacy runtime note machinery remains');
          if (html.includes("camera_id:'CAM-ID-SEMERU-A-20260912'")) throw new Error('Semeru Cam A must remain on HOLD');
          if (!html.includes('CAM-TW-TAITUNG-SANXIANTAI-20260912')) throw new Error('Sanxiantai missing');
          if (!html.includes('const SET_INTERVAL_MS = 2 * 60 * 1000;')) throw new Error('2-minute rotation contract missing');

          console.log('Watch Tower release contract verified: 50 cameras, 21 new additions, Semeru held, Behind the Cameras linked.');
          NODE
