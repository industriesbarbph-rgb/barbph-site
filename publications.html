<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<meta content="Read BarbPH publications and The Bulletin: essays, releases, updates, notes, and selected work from BarbPH." name="description"/>

<meta content="Publication &amp; Bulletin | BarbPH" property="og:title"/>
<meta content="Read BarbPH publications and The Bulletin: essays, releases, updates, notes, and selected work from BarbPH." property="og:description"/>
<meta content="https://barbph.com/publications" property="og:url"/>
<meta content="BarbPH" property="og:site_name"/>
<meta content="summary_large_image" name="twitter:card"/>

<style>
:root{--ink:#17191c;--paper:#f6f3eb;--line:rgba(23,25,28,.14);--muted:#73777b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
html{scroll-behavior:smooth}
body{padding:clamp(24px,4vw,62px)}
.wrap{width:min(1120px,100%);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:52px}
.back{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:999px;color:inherit;text-decoration:none;font-size:23px;background:rgba(255,255,255,.42)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,7vw,82px);font-weight:400;line-height:.98;margin:10px 0 28px;letter-spacing:-.03em}
.switch{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:34px}
.switch button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.36);padding:11px 18px;border-radius:999px;cursor:pointer;color:var(--ink)}
.switch button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:none}.panel.active{display:block}
.reference-note{display:none;margin:-12px 0 28px;padding:12px 14px;border-left:3px solid var(--ink);background:rgba(255,255,255,.44);font-size:13px;line-height:1.5;color:#4a4e51}
.reference-note.visible{display:block}
.publication{position:relative;padding:28px 0;border-bottom:1px solid var(--line);scroll-margin-top:32px;transition:background-color .4s ease,box-shadow .4s ease,padding .4s ease,margin .4s ease}
.publication:first-child{padding-top:0}
.publication.is-targeted{margin:0 -18px;padding-left:18px;padding-right:18px;background:rgba(255,255,255,.56);box-shadow:inset 4px 0 0 var(--ink)}
.date{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.publication h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(27px,4vw,44px);font-weight:400;margin:0 0 13px}
.publication p{font-size:16px;line-height:1.72;max-width:820px;margin:0;color:#3c4145;white-space:pre-wrap}
.publication p a{color:inherit;text-decoration:none}
.publication p a:hover,.publication p a:focus-visible{text-decoration:underline;text-underline-offset:4px}
.bulletin-item{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.bulletin-item p{margin:0;font-size:17px;line-height:1.5}
.bulletin-item a{white-space:nowrap;color:inherit;text-underline-offset:4px}
.empty{color:var(--muted);padding:24px 0}
@media(max-width:650px){.bulletin-item{align-items:flex-start;flex-direction:column;gap:8px}.publication.is-targeted{margin:0 -10px;padding-left:10px;padding-right:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.publication{transition:none}}
</style>
<meta content="https://barbph.com/3stars1sun%20%283%29.png" property="og:image"/><meta content="https://barbph.com/3stars1sun%20%283%29.png" name="twitter:image"/></head>
<body>
<div class="wrap">
<div class="top">
<div>
<div class="eyebrow">BarbPH</div>
<h1>Publication &amp; Bulletin</h1>
</div>
<a aria-label="Return to BarbPH" class="back" href="index.html">←</a>
</div>
<div aria-label="Publication and Bulletin" class="switch" role="tablist">
<button aria-selected="true" class="active" data-tab="publications" role="tab">Publications</button>
<button aria-selected="false" data-tab="bulletin" role="tab">Bulletin</button>
</div>
<div class="reference-note" id="publication-reference-note" role="status"></div>
<section class="panel active" id="publications">
<article class="publication">
<div class="date">August 15, 2026</div>
<h2>Why I started Barb the Builder</h2>
<p>A little backstory on how this whole thing started...</p>
</article>
</section>
<section class="panel" id="bulletin">
<div class="bulletin-item">
<p>20% off Jana this week — code BARB20</p>
<a href="https://experiencejustanotepad.netlify.app" rel="noopener" target="_blank">Open →</a>
</div>
</section>
</div>
<script>
(() => {
  const tabButtons=[...document.querySelectorAll('.switch button')];
  const panels=[...document.querySelectorAll('.panel')];
  const note=document.getElementById('publication-reference-note');

  function setTab(name){
    tabButtons.forEach(b=>{const active=b.dataset.tab===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',active?'true':'false')});
    panels.forEach(p=>p.classList.toggle('active',p.id===name));
  }

  tabButtons.forEach(btn=>btn.addEventListener('click',()=>setTab(btn.dataset.tab)));

  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ext=(href,label)=>`<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`;
  const safeId=value=>/^[A-Za-z0-9_-]{1,120}$/.test(String(value||''))?String(value):'';

  function focusHash(){
    const requested=decodeURIComponent(location.hash.replace(/^#/,''));
    document.querySelectorAll('.publication.is-targeted').forEach(node=>node.classList.remove('is-targeted'));
    note.classList.remove('visible');
    note.textContent='';
    if(!requested)return;

    setTab('publications');
    const target=[...document.querySelectorAll('[data-publication-id]')].find(node=>node.dataset.publicationId===requested);
    if(!target){
      note.textContent='The referenced publication is not currently available. The rest of the publication archive remains below.';
      note.classList.add('visible');
      return;
    }

    target.classList.add('is-targeted');
    target.setAttribute('tabindex','-1');
    requestAnimationFrame(()=>{
      target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
      target.focus({preventScroll:true});
    });
    setTimeout(()=>target.classList.remove('is-targeted'),4200);
  }

  if(location.protocol!=='file:'){
    fetch('/.netlify/functions/content-feed',{cache:'no-store'})
      .then(r=>r.ok?r.json():Promise.reject())
      .then(data=>{
        const pubs=document.getElementById('publications');
        const bull=document.getElementById('bulletin');
        if(Array.isArray(data.publications)){
          pubs.innerHTML=data.publications.length?data.publications.map(x=>{
            const title=esc(x.title);
            const body=x.body?(x.link?ext(x.link,x.body):esc(x.body)):(x.link?ext(x.link,'Open publication →'):'');
            const publicationId=safeId(x.publication_id);
            const idAttrs=publicationId?` id="${esc(publicationId)}" data-publication-id="${esc(publicationId)}"`:'';
            return `<article class="publication"${idAttrs}><div class="date">${esc(x.date_display||x.date)}</div><h2>${title}</h2>${body?`<p>${body}</p>`:''}</article>`;
          }).join(''):'<div class="empty">No published articles yet.</div>';
        }
        if(Array.isArray(data.bulletin)){
          bull.innerHTML=data.bulletin.length?data.bulletin.map(x=>`<div class="bulletin-item"><p>${esc(x.message)}</p>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">Open →</a>`:''}</div>`).join(''):'<div class="empty">No bulletin posts yet.</div>';
        }
        focusHash();
      }).catch(()=>{});
  } else {
    focusHash();
  }

  window.addEventListener('hashchange',focusHash);
})();
</script>
</body>
</html>
