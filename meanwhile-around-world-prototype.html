<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Meanwhile, Around the World — Prototype</title>
<style>
:root{color-scheme:light;--ink:#173229;--cream:#f4ead3;--line:rgba(255,255,255,.5);--glass:rgba(247,242,224,.18);--deep:#164c45;--brown:#7c532d;--blue:#26789a;--green:#6e8d42}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:white}body{overflow:hidden;background:radial-gradient(circle at 12% 10%,rgba(238,198,101,.82),transparent 28%),radial-gradient(circle at 88% 16%,rgba(45,132,176,.86),transparent 34%),radial-gradient(circle at 20% 90%,rgba(95,124,54,.82),transparent 30%),radial-gradient(circle at 78% 86%,rgba(115,76,39,.72),transparent 31%),linear-gradient(135deg,#496f4a 0%,#b38b50 31%,#3e918e 62%,#2e698f 100%);background-attachment:fixed}.stage{height:100dvh;display:grid;grid-template-rows:118px 1fr auto;gap:10px;padding:12px}.top{position:relative;display:grid;place-items:center;min-height:0}.orbit-wrap{position:relative;width:min(1050px,82vw);height:108px;filter:drop-shadow(0 4px 14px rgba(30,46,37,.28))}.orbit{width:100%;height:100%;overflow:visible}.orbit-spin{transform-origin:500px 55px;animation:orbitRotate 28s linear infinite}.orbit-track{fill:none;stroke:rgba(255,255,255,.88);stroke-width:1.4}.orbit-text{font-size:14px;letter-spacing:2px;fill:white;text-transform:uppercase}.signal{fill:white;filter:drop-shadow(0 0 8px white);animation:signalPulse 4.8s ease-in-out infinite}@keyframes orbitRotate{to{transform:rotate(360deg)}}@keyframes signalPulse{0%,18%,100%{opacity:.42;r:5}5%{opacity:1;r:9}10%{opacity:.55;r:6}14%{opacity:1;r:8}}.signal-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.9);text-shadow:0 1px 8px rgba(0,0,0,.25);pointer-events:none}.signal-label b{font-weight:700}.grid{min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}.tile{position:relative;min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.48);border-radius:14px;background:rgba(18,48,42,.25);box-shadow:0 10px 25px rgba(54,42,24,.14),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(8px)}.grid[data-count="5"] .tile:nth-child(-n+3){grid-column:span 2}.grid[data-count="5"] .tile:nth-child(n+4){grid-column:span 3}.grid[data-count="4"] .tile{grid-column:span 3}.grid[data-count="6"] .tile{grid-column:span 2}.tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#13211e}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,22,20,.04),transparent 55%,rgba(10,25,23,.72));z-index:2}.meta{position:absolute;left:10px;right:10px;bottom:9px;z-index:3;display:flex;align-items:end;justify-content:space-between;gap:12px;text-shadow:0 1px 5px #000}.place strong{display:block;font-size:14px}.place span,.state span{font-size:10px;color:rgba(255,255,255,.88)}.state{text-align:right}.state strong{display:block;font-size:12px}.live{position:absolute;top:9px;right:9px;z-index:3;padding:4px 7px;border-radius:999px;background:rgba(49,112,60,.92);font-size:9px;font-weight:700;letter-spacing:.12em}.credit{position:absolute;top:9px;left:9px;z-index:3;max-width:72%;padding:4px 6px;border-radius:999px;background:rgba(26,56,48,.72);font-size:8px;color:rgba(255,255,255,.86)}.bottom{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;align-items:stretch}.foot-card{min-height:54px;padding:9px 12px;border:1px solid rgba(255,255,255,.38);border-radius:12px;background:rgba(247,242,224,.18);backdrop-filter:blur(10px);color:white;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.4;text-shadow:0 1px 4px rgba(0,0,0,.2)}.foot-card strong{display:block;font-size:12px}.ref strong{font-size:14px;letter-spacing:.08em}.ledger{font-weight:700;letter-spacing:.08em}@media(max-width:760px){body{overflow:auto}.stage{height:auto;min-height:100dvh;grid-template-rows:100px auto auto}.orbit-wrap{width:96vw;height:94px}.orbit-text{font-size:12px}.grid{grid-template-columns:1fr;grid-auto-rows:42vh}.grid .tile{grid-column:1!important}.bottom{grid-template-columns:1fr 1fr}.signal-label{font-size:8px}}
</style></head>
<body><main class="stage"><header class="top"><div class="orbit-wrap"><svg class="orbit" viewBox="0 0 1000 110" role="img" aria-label="Live Cities One Moment All Seasons Real Time Around the World Coach Doll Patrols"><defs><path id="orbitPath" d="M80,55 C80,12 920,12 920,55 C920,98 80,98 80,55 Z"/></defs><g class="orbit-spin"><use href="#orbitPath" class="orbit-track"/><text class="orbit-text"><textPath href="#orbitPath" startOffset="1%">LIVE CITIES · ONE MOMENT · ALL SEASONS · REAL TIME AROUND THE WORLD · COACH DOLL PATROLS · LIVE CITIES · ONE MOMENT · ALL SEASONS · REAL TIME AROUND THE WORLD · COACH DOLL PATROLS ·</textPath></text><circle class="signal" cx="920" cy="55" r="6"/></g></svg><div class="signal-label"><b>COACH DOLL PATROLS</b> · LIVE SIGNAL</div></div></header><section id="grid" class="grid"></section><footer class="bottom"><div class="foot-card"><span><strong>Different places. Same moment.</strong>Our world is always alive.</span></div><div class="foot-card"><span><strong>2 minutes</strong>Every 4 hours</span></div><div class="foot-card ref"><span>REFERENCE<br><strong id="utcClock">UTC —</strong>PHT offset +8</span></div><div class="foot-card ledger">TRANSMISSION LEDGER</div></footer></main>
<script>
const feeds=[
{id:'london',city:'London',country:'United Kingdom',timezone:'Europe/London',hemisphere:'north',embed_url:'https://portofcams.com/embed/windy-london/',source_name:'Port of Cams',credit_text:'London live camera via Port of Cams'},
{id:'venice',city:'Venice',country:'Italy',timezone:'Europe/Rome',hemisphere:'north',embed_url:'https://portofcams.com/embed/venice-canal/',source_name:'Port of Cams',credit_text:'Venice Grand Canal live camera via Port of Cams'},
{id:'tokyo',city:'Tokyo',country:'Japan',timezone:'Asia/Tokyo',hemisphere:'north',embed_url:'https://camstreamer.com/embed/gvwteHj04P0qq1ygIgt8sEVQYPotE1ZfaeALWlKl?rel=0',source_name:'CamStreamer',credit_text:'Tokyo Shinjuku live camera via CamStreamer'},
{id:'naha',city:'Naha, Okinawa',country:'Japan',timezone:'Asia/Tokyo',hemisphere:'north',embed_url:'https://portofcams.com/embed/windy-naha/',source_name:'Port of Cams',credit_text:'Naha Tomarin Harbour live camera via Port of Cams'},
{id:'buenosaires',city:'Buenos Aires',country:'Argentina',timezone:'America/Argentina/Buenos_Aires',hemisphere:'south',embed_url:'https://opencctv.org/cameras/argentina/autonomous-city-of-buenos-aires/autonomous-city-of-buenos-aires/autonomous-city-of-buenos-aires-oficina-externa-301693',source_name:'OpenCCTV',credit_text:'Buenos Aires live camera via OpenCCTV'}
];
function parts(tz){const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,month:'numeric'}),p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));return{time:`${p.hour}:${p.minute}:${p.second}`,hour:+p.hour,month:+p.month}}function season(m,h){let s=[3,4,5].includes(m)?'Spring':[6,7,8].includes(m)?'Summer':[9,10,11].includes(m)?'Autumn':'Winter';return h==='south'?{Spring:'Autumn',Summer:'Winter',Autumn:'Spring',Winter:'Summer'}[s]:s}function daylight(h){return h>=6&&h<18?'Day':'Night'}function tickUTC(){document.getElementById('utcClock').textContent='UTC '+new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}function tile(f){const p=parts(f.timezone),t=document.createElement('article');t.className='tile';t.dataset.id=f.id;t.innerHTML=`<iframe src="${f.embed_url}" title="${f.city}, ${f.country} live camera" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><div class="shade"></div><div class="credit">${f.credit_text}</div><div class="live">LIVE</div><div class="meta"><div class="place"><strong>${f.city}, ${f.country}</strong><span>${f.source_name}</span></div><div class="state"><strong>${p.time}</strong><span>${daylight(p.hour)} · ${season(p.month,f.hemisphere)}</span></div></div>`;return t}const grid=document.getElementById('grid');grid.dataset.count=feeds.length;feeds.forEach(f=>grid.append(tile(f)));tickUTC();setInterval(()=>{tickUTC();document.querySelectorAll('.tile').forEach(t=>{const f=feeds.find(x=>x.id===t.dataset.id),p=parts(f.timezone);t.querySelector('.state').innerHTML=`<strong>${p.time}</strong><span>${daylight(p.hour)} · ${season(p.month,f.hemisphere)}</span>`})},1000);
</script></body></html>
