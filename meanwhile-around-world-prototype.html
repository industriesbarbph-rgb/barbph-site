<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Meanwhile, Around the World — Prototype</title>
<style>
:root{color-scheme:dark;--bg:#05070a;--panel:#0b0f14;--line:rgba(255,255,255,.16);--muted:rgba(255,255,255,.62)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}.stage{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.identity{position:relative;flex:1;text-align:center;padding:8px 150px 8px 0}.strap{font-size:clamp(13px,1.7vw,24px);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}.world{position:relative;display:inline-block}.halo{position:absolute;width:88px;height:43px;right:-19px;top:-13px;transform:rotate(-13deg);border:1.5px solid rgba(255,255,255,.85);border-radius:50%;filter:drop-shadow(0 0 5px rgba(255,255,255,.35));pointer-events:none}.halo:before{content:'COACH DOLL PATROLS · COACH DOLL PATROLS';position:absolute;left:3px;top:-10px;width:105px;font-size:5px;letter-spacing:.08em;color:#fff;white-space:nowrap;transform:rotate(4deg)}.pulse{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;right:7px;top:-1px;box-shadow:0 0 8px 2px rgba(255,255,255,.7);animation:heartbeat 4.6s ease-in-out infinite}@keyframes heartbeat{0%,18%,100%{opacity:.35;transform:scale(.75)}5%{opacity:1;transform:scale(1.35)}9%{opacity:.55;transform:scale(.9)}13%{opacity:1;transform:scale(1.15)}}.ref{text-align:right;min-width:150px;border:1px solid var(--line);padding:8px 10px;border-radius:7px}.ref b{display:block;font-size:10px;letter-spacing:.15em;color:var(--muted)}.ref strong{display:block;margin-top:3px;font-size:18px}.ref span{display:block;margin-top:2px;font-size:9px;color:var(--muted);letter-spacing:.09em}.grid{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}.tile{position:relative;min-height:0;overflow:hidden;border:1px solid var(--line);background:var(--panel)}.tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.06),transparent 56%,rgba(0,0,0,.74));z-index:2}.meta{position:absolute;left:10px;right:10px;bottom:9px;z-index:3;display:flex;align-items:end;justify-content:space-between;gap:12px;text-shadow:0 1px 5px #000}.place strong{display:block;font-size:14px}.place span,.state span{font-size:10px;color:rgba(255,255,255,.8)}.state{text-align:right}.state strong{display:block;font-size:12px}.live{position:absolute;top:9px;right:9px;z-index:3;padding:4px 7px;border-radius:999px;background:rgba(184,0,0,.9);font-size:9px;font-weight:700;letter-spacing:.12em}.credit{position:absolute;top:9px;left:9px;z-index:3;max-width:70%;padding:4px 6px;background:rgba(0,0,0,.55);font-size:8px;color:rgba(255,255,255,.76)}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:10px}.bottom strong{color:#fff}@media(min-width:1000px){.grid[data-count="3"],.grid[data-count="4"],.grid[data-count="5"],.grid[data-count="6"],.grid[data-count="7"],.grid[data-count="8"],.grid[data-count="9"]{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){body{overflow:auto}.stage{height:auto;min-height:100dvh}.top{align-items:flex-start}.identity{padding:8px 0;text-align:left}.strap{white-space:normal;line-height:1.5}.ref{min-width:115px}.grid{grid-template-columns:1fr;grid-auto-rows:42vh}.bottom{flex-direction:column;align-items:flex-start}}
</style></head><body><main class="stage"><header class="top"><div class="identity"><div class="strap">Live Cities · One Moment · All Seasons · Real Time Around The <span class="world">World<span class="halo"><i class="pulse"></i></span></span></div></div><div class="ref"><b>REFERENCE TIME</b><strong id="utcClock">—</strong><span>UTC · PHT OFFSET +8</span></div></header><section id="grid" class="grid"></section><footer class="bottom"><span><strong>Different places. Same moment.</strong> Our world is always alive.</span><span>Production cadence: 2 minutes every 4 hours · Transmission Ledger</span></footer></main><script>
const feeds=[{id:'london',city:'London',country:'United Kingdom',timezone:'Europe/London',hemisphere:'north',embed_url:'https://portofcams.com/embed/windy-london/',source_name:'Port of Cams',credit_text:'London live camera via Port of Cams'},{id:'venice',city:'Venice',country:'Italy',timezone:'Europe/Rome',hemisphere:'north',embed_url:'https://portofcams.com/embed/venice-canal/',source_name:'Port of Cams',credit_text:'Venice Grand Canal live camera via Port of Cams'},{id:'tokyo',city:'Tokyo',country:'Japan',timezone:'Asia/Tokyo',hemisphere:'north',embed_url:'https://camstreamer.com/embed/gvwteHj04P0qq1ygIgt8sEVQYPotE1ZfaeALWlKl?rel=0',source_name:'CamStreamer',credit_text:'Tokyo Shinjuku live camera via CamStreamer'},{id:'buenosaires',city:'Buenos Aires',country:'Argentina',timezone:'America/Argentina/Buenos_Aires',hemisphere:'south',embed_url:'https://opencctv.org/cameras/argentina/autonomous-city-of-buenos-aires/autonomous-city-of-buenos-aires/autonomous-city-of-buenos-aires-oficina-externa-301693',source_name:'OpenCCTV',credit_text:'Buenos Aires live camera via OpenCCTV'}];
function parts(tz){const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,month:'numeric'}),p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));return{time:`${p.hour}:${p.minute}:${p.second}`,hour:+p.hour,month:+p.month}}function season(m,h){let s=[3,4,5].includes(m)?'Spring':[6,7,8].includes(m)?'Summer':[9,10,11].includes(m)?'Autumn':'Winter';return h==='south'?{Spring:'Autumn',Summer:'Winter',Autumn:'Spring',Winter:'Summer'}[s]:s}function daylight(h){return h>=6&&h<18?'Day':'Night'}function tickUTC(){document.getElementById('utcClock').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}function tile(f){const p=parts(f.timezone),t=document.createElement('article');t.className='tile';t.dataset.id=f.id;t.innerHTML=`<iframe src="${f.embed_url}" title="${f.city}, ${f.country} live camera" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><div class="shade"></div><div class="credit">${f.credit_text}</div><div class="live">LIVE</div><div class="meta"><div class="place"><strong>${f.city}, ${f.country}</strong><span>${f.source_name}</span></div><div class="state"><strong>${p.time}</strong><span>${daylight(p.hour)} · ${season(p.month,f.hemisphere)}</span></div></div>`;return t}const grid=document.getElementById('grid');grid.dataset.count=feeds.length;feeds.forEach(f=>grid.append(tile(f)));tickUTC();setInterval(()=>{tickUTC();document.querySelectorAll('.tile').forEach(t=>{const f=feeds.find(x=>x.id===t.dataset.id),p=parts(f.timezone);t.querySelector('.state').innerHTML=`<strong>${p.time}</strong><span>${daylight(p.hour)} · ${season(p.month,f.hemisphere)}</span>`})},1000);
</script></body></html>
